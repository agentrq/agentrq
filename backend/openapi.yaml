openapi: 3.0.3
info:
  title: AgentRQ API
  version: 1.0.0
  description: |
    OpenAPI specification for the AgentRQ backend HTTP API.

    ## Authentication

    Every route except those under `/auth` requires the `at` session cookie,
    set by one of the login flows. There is no bearer-token path: the frontend
    and the desktop app both address the API with same-origin relative URLs and
    let the cookie ride along.

    ## Conventions

    - All request and response JSON uses `camelCase`.
    - IDs are base62-encoded monoflakes rendered as strings, never numbers.
    - Most payloads are wrapped in a single named key — `{"task": {...}}`,
      `{"workspaces": [...]}` — rather than returned bare.

    ## Errors

    Two shapes are in use. Handlers that map a domain error return the
    structured envelope (`ErrorResponse`); several that validate inline return
    a flat `{"error": "message"}` (`SimpleError`). Each operation below names
    the one it returns.
servers:
  - url: /api/v1

tags:
  - name: Auth
  - name: Account
  - name: Workspaces
  - name: Tasks
  - name: Attachments
  - name: Events
  - name: Hooks
  - name: Teams
  - name: Team mode
  - name: Workflows
  - name: Skills
  - name: Pano
  - name: Push
  - name: Telemetry
  - name: Browser
  - name: Streaming

paths:
  # ── Auth ────────────────────────────────────────────────────────────────────
  /auth/config:
    get:
      tags: [Auth]
      summary: Which login methods this deployment offers
      description: Public. Read before rendering a login screen.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rootLoginEnabled: { type: boolean }
                  githubLoginEnabled: { type: boolean }
                  oauth2Providers:
                    type: array
                    description: Sign-in providers besides Google and GitHub, added by the operator.
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        iconUrl: { type: string }
                  basePath:
                    type: string
                    description: Path prefix the app is served under, if any.

  /sentry:
    get:
      tags: [Auth]
      summary: Where the web app reports its errors
      description: Null when frontend Sentry is off.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                nullable: true
                properties:
                  dsn: { type: string }
                  environment: { type: string }
    post:
      tags: [Auth]
      summary: Relay one of the web app's Sentry envelopes
      description: >-
        Served only when frontend Sentry is enabled. The envelope must name
        the configured frontend DSN; it is passed on to that Sentry project,
        and Sentry's status and rate-limit headers come back.
      requestBody:
        required: true
        content:
          application/x-sentry-envelope:
            schema: { type: string }
      responses:
        '200': { description: Accepted by Sentry }
        '400': { description: Not an envelope for the configured project }
        '502': { description: Sentry could not be reached }

  /auth/google/login:
    get:
      tags: [Auth]
      summary: Begin the Google OAuth flow
      security: []
      parameters:
        - name: redirect_url
          in: query
          required: false
          schema: { type: string }
          description: Where to land after login. Sanitized server-side.
      responses:
        '302': { description: Redirect to Google }

  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth callback
      security: []
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Session cookies set, then redirect.

  /auth/github/login:
    get:
      tags: [Auth]
      summary: Begin the GitHub OAuth flow
      security: []
      parameters:
        - name: redirect_url
          in: query
          required: false
          schema: { type: string }
      responses:
        '302': { description: Redirect to GitHub }
        '403':
          description: GitHub login is not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /auth/github/callback:
    get:
      tags: [Auth]
      summary: GitHub OAuth callback
      security: []
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Session cookies set, then redirect.

  /auth/oauth2/{id}/login:
    get:
      tags: [Auth]
      summary: Begin the OAuth flow of a provider the operator added
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: redirect_url
          in: query
          required: false
          schema: { type: string }
      responses:
        '302': { description: Redirect to the provider }
        '404':
          description: No such provider
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /auth/oauth2/{id}/callback:
    get:
      tags: [Auth]
      summary: OAuth callback of a provider the operator added
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Session cookies set, then redirect.
        '400':
          description: The state is missing, expired, or for another provider
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '404':
          description: No such provider
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /auth/root/login:
    post:
      tags: [Auth]
      summary: Log in with the root token
      description: |
        Only available when root login is enabled for the deployment; check
        `rootLoginEnabled` from `/auth/config` first.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
      responses:
        '200':
          description: Session cookies set
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        '400':
          description: Invalid payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '401':
          description: Invalid root token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '403':
          description: Root login disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange the refresh cookie for a fresh session
      description: |
        Public by design — the whole point is that the access token has already
        expired. Reads the `rt` cookie, which is scoped to this path.
      security: []
      responses:
        '200':
          description: New session cookies set
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        '401':
          description: Session expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /auth/user:
    get:
      tags: [Auth]
      summary: The authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401':
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Clear the session cookies
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  # ── Workspaces ──────────────────────────────────────────────────────────────
  /workspaces:
    get:
      tags: [Workspaces]
      summary: List workspaces
      parameters:
        - name: archived
          in: query
          required: false
          schema: { type: string, enum: ['true'] }
          description: Pass `true` to list archived workspaces instead of active ones.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaces:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
    post:
      tags: [Workspaces]
      summary: Create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace: { $ref: '#/components/schemas/Workspace' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace: { $ref: '#/components/schemas/Workspace' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/supervisor:
    post:
      tags: [Workspaces]
      summary: Get the supervisor workspace, creating it if there is none
      description: |
        Answers with the account's `supervisor` workspace. When it has been
        deleted, it is made again with the defaults a new account gets. The
        Pano's chat talks to it.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace: { $ref: '#/components/schemas/Workspace' }

  /workspaces/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      summary: Get a workspace
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace: { $ref: '#/components/schemas/Workspace' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Workspaces]
      summary: Update a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace: { $ref: '#/components/schemas/Workspace' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace: { $ref: '#/components/schemas/Workspace' }
        '422': { $ref: '#/components/responses/InvalidPayload' }
    delete:
      tags: [Workspaces]
      summary: Delete a workspace
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{id}/token:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      summary: Mint this workspace's MCP token
      description: |
        Returns a long-lived token (365 days) whose audience is this workspace
        plus `access`. This is the token that goes in `.mcp.json`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      summary: Archive a workspace
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: archived }

  /workspaces/{id}/forks:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      summary: Fork a workspace
      description: |
        Makes a workspace fork: a workspace of its own, with its own queue and
        agent, that inherits the parent's settings and is merged back into it.
        A fork of a fork, of the `supervisor` workspace or of an archived
        workspace is refused.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 128
                  description: In kebab-case, like other workspace names. Defaults to "<parent>-fork".
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace: { $ref: '#/components/schemas/Workspace' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Invalid payload, or a workspace that cannot be forked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workspaces/{id}/merge:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      summary: Merge a fork back into its parent
      description: |
        Moves every task of the fork, with its whole thread, into the parent
        and removes the fork. Refused while any task in the fork is not
        finished (completed or rejected); a scheduled task moves back with
        its schedule.

        The request body is optional. With `deleteFolder: true` the fork's
        folder is also deleted from each machine that ran it (a git worktree
        is removed and its branch kept). The merge is refused (409) when such
        a machine is offline or runs an agentrqd that cannot delete the folder.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deleteFolder: { type: boolean, default: false }
      responses:
        '200':
          description: Merged
          content:
            application/json:
              schema:
                type: object
                properties:
                  parentId: { type: string }
                  movedTasks: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A task in the fork is not finished, or its folder cannot be deleted right now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: The workspace is not a fork
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workspaces/{id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      summary: Restore an archived workspace
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: unarchived }

  /workspaces/{id}/reset-id:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      summary: Give a workspace a new id
      description: |
        Revokes every MCP token issued for the workspace, each of which is
        bound to its id. The workspace, everything in it and its attachment
        files move to the new id, so its MCP URL and the links to it and its
        tasks change. Agents connected with the old URL must be set up again.
      responses:
        '200':
          description: The new id
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /stats:
    get:
      tags: [Workspaces]
      summary: Activity statistics across every workspace the caller owns
      description: >
        The same aggregates as `/workspaces/{id}/stats`, summed over the whole
        account, plus a per-workspace breakdown of what drove them. The scope is
        the authenticated caller, so there is no id to pass.
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: ['1d', '7d', 'week', '30d', 'month', 'custom']
            default: '7d'
        - name: from
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Unix timestamp. Used only when `range=custom`.
        - name: to
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Unix timestamp. Used only when `range=custom`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserStats' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /stats/latency:
    get:
      tags: [Workspaces]
      summary: How long closed tasks took, across every workspace the caller owns
      description: >
        The account-wide counterpart of `/workspaces/{id}/stats/latency`.
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: ['1d', '7d', 'week', '30d', 'month', 'custom']
            default: '7d'
        - name: from
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Unix timestamp. Used only when `range=custom`.
        - name: to
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Unix timestamp. Used only when `range=custom`.
        - name: aggregate
          in: query
          required: false
          schema:
            type: string
            enum: ['p50', 'min', 'max']
            default: 'p50'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskLatencyStats' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/stats:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      summary: Activity statistics for a workspace
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: ['1d', '7d', 'week', '30d', 'month', 'custom']
            default: '7d'
        - name: from
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Unix timestamp. Used only when `range=custom`.
        - name: to
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Unix timestamp. Used only when `range=custom`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceStats' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/stats/latency:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      summary: How long the workspace's closed tasks took
      description: >
        For the tasks closed (completed or rejected) in the period: start to
        close, time worked (ongoing), blocked, and needing input, in seconds,
        per bucket and over the whole period. The bucket is an hour for a
        period up to two days, a day up to 92 days, and a month beyond, in UTC,
        and the period is widened to whole buckets. `min` and `max` are exact;
        `p50` is interpolated from a fixed histogram. A bucket with no closed
        task has `seconds: null`. A task that closes again after a reopen is
        counted again, in the bucket of its new close.
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: ['1d', '7d', 'week', '30d', 'month', 'custom']
            default: '7d'
        - name: from
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Unix timestamp. Used only when `range=custom`.
        - name: to
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Unix timestamp. Used only when `range=custom`.
        - name: aggregate
          in: query
          required: false
          schema:
            type: string
            enum: ['p50', 'min', 'max']
            default: 'p50'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskLatencyStats' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/memories:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      summary: What this workspace remembers
      description: >
        The workspace's memories, written by agents through the `saveMemory` MCP
        tool. `content` is omitted here — each memory runs to 16 KiB, so the list
        carries only names and sizes. Fetch one by name for its content.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  memories:
                    type: array
                    items: { $ref: '#/components/schemas/Memory' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/memories/{name}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: name
        in: path
        required: true
        schema: { type: string, maxLength: 32 }
        description: >
          The memory's name, as the agent saved it. `MEMORY.md` is the index
          agents read first.
    get:
      tags: [Workspaces]
      summary: One memory, in full
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  memory: { $ref: '#/components/schemas/Memory' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /account/settings:
    get:
      tags: [Account]
      summary: The account's settings
      description: >
        Settings that hold in every workspace of the account. An account that
        never saved any reads as the defaults.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: '#/components/schemas/AccountSettings' }
    put:
      tags: [Account]
      summary: Save the account's settings
      description: >
        Saves the settings it is sent and returns them all; a setting left out
        keeps its value. An unknown setting or a value it may not hold refuses
        the whole save.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The fields to save, in their groups, as AccountSettings has them.
              properties:
                display:
                  type: object
                  properties:
                    timeFormat: { type: string, enum: [browser, 12h, 24h] }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: '#/components/schemas/AccountSettings' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /account/presets:
    get:
      tags: [Account]
      summary: The account's own presets
      description: >
        Messages the composer puts in place of `#name` in every workspace,
        ordered by name. Where a workspace has its own preset of the same name, the composer uses the workspace's.
        Their `workspaceId` is blank.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  presets:
                    type: array
                    items: { $ref: '#/components/schemas/Preset' }
    post:
      tags: [Account]
      summary: Save an account preset
      description: >
        The rules for a workspace's preset; the account keeps up to 100 of its
        own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, body]
              properties:
                name: { type: string, maxLength: 64 }
                body: { type: string }
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  preset: { $ref: '#/components/schemas/Preset' }
        '409':
          description: The account has a preset by that name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /account/presets/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    put:
      tags: [Account]
      summary: Edit an account preset
      description: >
        Replaces the preset's body, and renames it when `name` is given and
        differs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                name: { type: string, maxLength: 64 }
                body: { type: string }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  preset: { $ref: '#/components/schemas/Preset' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The account has a preset by the new name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/InvalidPayload' }
    delete:
      tags: [Account]
      summary: Remove an account preset
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/presets:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      summary: The workspace's presets
      description: >
        Messages the composer puts in place of `#name`, ordered by name. A fork
        has its parent's.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  presets:
                    type: array
                    items: { $ref: '#/components/schemas/Preset' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }
    post:
      tags: [Workspaces]
      summary: Save a preset
      description: >
        The name follows the skill naming rules: lowercase letters and digits
        joined by single hyphens, up to 64 characters. The body is up to 16 KiB,
        and a workspace keeps up to 100 presets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, body]
              properties:
                name: { type: string, maxLength: 64 }
                body: { type: string }
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  preset: { $ref: '#/components/schemas/Preset' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The workspace has a preset by that name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/presets/{name}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: name
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    put:
      tags: [Workspaces]
      summary: Edit a preset
      description: >
        Replaces the preset's body, and renames it when `name` is given and
        differs. The new name and body follow the rules for saving one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                name: { type: string, maxLength: 64 }
                body: { type: string }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  preset: { $ref: '#/components/schemas/Preset' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The workspace has a preset by the new name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/InvalidPayload' }
    delete:
      tags: [Workspaces]
      summary: Remove a preset
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/skills:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      summary: The account's skills, as this workspace sees them
      description: >
        Every skill of the account, by name, each with `workspaceEnabled`:
        whether it is on in this workspace (its parent, for a fork). The
        workspace's agent sees a skill only when it is on here and `enabled`
        for the account. With `q`, only skills whose name or description
        contains it, ignoring case. `files` is omitted.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 3, maxLength: 256 }
          description: Text to find in a skill's name or description. Leave it out to list every skill.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 100 }
          description: How many skills to return; larger values are capped at 100. Leave it out, or 0, to return every match.
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
          description: How many matches to skip.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  skills:
                    type: array
                    items: { $ref: '#/components/schemas/Skill' }
                  total:
                    type: integer
                    description: How many skills match in all, across every page.
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/skills/{name}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SkillName'
    get:
      tags: [Workspaces]
      summary: One skill as this workspace sees it, with its list of files
      description: The files are listed by path and size, without content.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  skill: { $ref: '#/components/schemas/Skill' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }
    patch:
      tags: [Workspaces]
      summary: Turn a skill on or off in this workspace
      description: >
        On, this workspace's agent sees the skill, as long as it is on for the
        account too. Off, the skill stays in the account and in every other
        workspace it is on in. A fork's switch is its parent's.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  skill: { $ref: '#/components/schemas/Skill' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/skills/{name}/files/{path}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SkillName'
      - name: path
        in: path
        required: true
        schema: { type: string, maxLength: 255 }
        description: >
          The file's path from the skill's root, e.g. `SKILL.md` or
          `scripts/run.sh`. It is the rest of the URL, so it may contain `/`.
    get:
      tags: [Workspaces]
      summary: One file of a skill, with its content
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  skill: { $ref: '#/components/schemas/Skill' }
                  file: { $ref: '#/components/schemas/SkillFile' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /pano:
    get:
      tags: [Pano]
      summary: List the Pano's docs
      description: >
        Every live doc of the account, without its markdown, files, attachments
        or comments. The person's docs come first, newest first, then the
        agents', newest first.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  docs:
                    type: array
                    items: { $ref: '#/components/schemas/PanoDoc' }
    post:
      tags: [Pano]
      summary: Create a Pano doc, as the person
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavePanoDocRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanoDocResponse' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /pano/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Pano]
      summary: Read a Pano doc, with its files, attachments and comments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanoDocResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Pano]
      summary: Replace a Pano doc's title and markdown, as the person
      description: >
        A linked file the markdown no longer links is deleted; one sent under
        a name the doc has replaces it. Attachments and comments are kept.
        The request must carry the `version` that was read; if the doc has
        changed since, nothing is written and the answer is 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavePanoDocRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanoDocResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The doc changed since `version` was read, or no version was sent. Read the doc again and redo the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/InvalidPayload' }
    delete:
      tags: [Pano]
      summary: Delete a Pano doc, its files and comments
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /pano/{id}/comments:
    post:
      tags: [Pano]
      summary: Comment on a Pano doc, as the person
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 16384 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment: { $ref: '#/components/schemas/PanoComment' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /pano/{id}/attachments:
    post:
      tags: [Pano]
      summary: Attach files to a Pano doc; they need no link
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { $ref: '#/components/schemas/PanoUpload' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items: { $ref: '#/components/schemas/PanoFile' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /skills:
    get:
      tags: [Skills]
      summary: Search the account's skills
      description: >
        Every skill of the account, by name, each with the workspaces it is on
        in. With `q`, only skills whose name or description contains it,
        ignoring case. `files` is omitted.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 3, maxLength: 256 }
          description: Text to find in a skill's name or description. Leave it out to list every skill.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 100 }
          description: How many skills to return; larger values are capped at 100. Leave it out, or 0, to return every match.
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
          description: How many matches to skip.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  skills:
                    type: array
                    items: { $ref: '#/components/schemas/Skill' }
                  total:
                    type: integer
                    description: How many skills match in all, across every page.
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /skills/import:
    post:
      tags: [Skills]
      summary: Import skills from a GitHub or GitLab repository
      description: >
        Downloads the repository once and imports every skill in it. A plugin
        manifest, `.agentrq/plugin.json` or else `.muse-plugin/plugin.json`,
        says which directories are skills; without one, every directory with a
        `SKILL.md` is. A skill keeps its Markdown files, except a repository's
        own README, CLAUDE, AGENTS and similar meta files, and any other file
        its kept files reference, directly or in turn. Anything left out is
        listed in `skipped` with the reason, rather than failing the import.
        A repository too large to download whole imports nothing: its skills
        come back in `candidates`, and the import is asked again with the
        wanted ones in `skills`, which are then read file by file. Every
        skill imported belongs to the account, and is turned on in each
        workspace of `workspaceIds`. A private repository is read through the
        account's connection to the server's GitHub App (`/github`), when it
        has one on the repository's owner. A GitLab project is read from the
        server's GitLab host (`/gitlab`); a private one through the account's
        GitLab connection, when it has one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  example: https://github.com/obra/superpowers
                  description: >
                    `https://github.com/<owner>/<repo>`, optionally ending in
                    `.git`, `/tree/<ref>` or `/tree/<ref>/<path>`; or
                    `https://<gitlab host>/<group>[/<subgroup>…]/<project>`,
                    optionally ending in `.git`, `/-/tree/<ref>` or
                    `/-/tree/<ref>/<path>`.
                overwrite:
                  type: boolean
                  default: false
                  description: >
                    Replace the account's skill that has the same name. It keeps
                    the workspaces it is on in, and whether it is on at all.
                skills:
                  type: array
                  maxItems: 256
                  items: { type: string }
                  example: [ship, careful]
                  description: >
                    Import only these skills, by their directory in the
                    repository as `candidates` gives it.
                workspaceIds:
                  type: array
                  items: { type: string }
                  description: >
                    Workspaces (base62) to turn each imported skill on in. A
                    fork stands for its parent.
      responses:
        '200':
          description: What was imported, and what was left out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillImportReport' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Not a GitHub or GitLab repository link, or one the host does not serve to the account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: GitHub or GitLab could not be reached, or would not list a repository too large to import whole
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /gitlab:
    get:
      tags: [Skills]
      summary: The account's connection to the server's GitLab
      description: >
        The GitLab host skills are imported from, which the server's admin
        sets (gitlab.com by default), and, while the admin has set up an
        OAuth application on it, the link to connect the account and the
        GitLab account connected. GitLab returns from that link to
        `<baseUrl>/gitlab/callback` in the web app, which posts what it sent
        to `/gitlab/connection`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitLabConnection' }

  /gitlab/connection:
    post:
      tags: [Skills]
      summary: Finish connecting GitLab
      description: >
        Takes the code and state GitLab returned with, and keeps the token
        GitLab grants for them, encrypted, in place of the account's earlier
        connection. The state must have been made for this account, within the
        last 30 minutes. Imports of the account's private projects on the
        server's GitLab then read with it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        '200':
          description: The connection, as `/gitlab` answers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitLabConnection' }
        '422':
          description: Connecting is not configured, the state is not this account's or has expired, or a field is missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: GitLab refused the code, or could not be reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Skills]
      summary: Disconnect GitLab
      description: Forgets the account's GitLab connection, and asks GitLab to revoke its token.
      responses:
        '204': { description: Disconnected }
        '404': { $ref: '#/components/responses/NotFound' }

  /github:
    get:
      tags: [Skills]
      summary: The account's connection to the server's GitHub App
      description: >
        Whether the server offers private skill imports through a GitHub App
        its admin configured, the link to install the app on a GitHub account
        (or change which repositories it reads), and the installations the
        account imports through. GitHub returns from that link to
        `<baseUrl>/github/callback` in the web app, which posts what it sent to
        `/github/installations`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubConnection' }

  /github/installations:
    post:
      tags: [Skills]
      summary: Finish connecting GitHub
      description: >
        Takes the code and state GitHub returned with, and stores the app's
        installations GitHub lists for the person who authorised the code, in
        place of the account's earlier ones. The state must have been made for
        this account, within the last 30 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        '200':
          description: The connection, as `/github` answers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubConnection' }
        '422':
          description: The app is not configured, the state is not this account's or has expired, or a field is missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: GitHub refused the code, or could not be reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /github/installations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: GitHub's number for the installation.
        schema: { type: integer, format: int64 }
    delete:
      tags: [Skills]
      summary: Stop importing through one installation
      description: The app stays installed on GitHub, where only its owner can uninstall it.
      responses:
        '204': { description: Disconnected }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /skills/{name}:
    parameters:
      - $ref: '#/components/parameters/SkillName'
    get:
      tags: [Skills]
      summary: One skill, with its list of files
      description: The files are listed by path and size, without content.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  skill: { $ref: '#/components/schemas/Skill' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }
    patch:
      tags: [Skills]
      summary: Turn a skill on or off for every workspace
      description: >
        A skill that is off stays in the account, and on in its workspaces,
        but no agent sees it: `searchSkills` leaves it out and `loadSkill`
        does not find it. Skills are on when created or imported, and a
        re-import keeps one off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  skill: { $ref: '#/components/schemas/Skill' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }
    delete:
      tags: [Skills]
      summary: Delete a skill and its files from the account
      description: Every workspace it was on in loses it.
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /skills/{name}/files/{path}:
    parameters:
      - $ref: '#/components/parameters/SkillName'
      - name: path
        in: path
        required: true
        schema: { type: string, maxLength: 255 }
        description: >
          The file's path from the skill's root, e.g. `SKILL.md` or
          `scripts/run.sh`. It is the rest of the URL, so it may contain `/`.
    get:
      tags: [Skills]
      summary: One file of a skill, with its content
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  skill: { $ref: '#/components/schemas/Skill' }
                  file: { $ref: '#/components/schemas/SkillFile' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/slack:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    put:
      tags: [Workspaces]
      summary: Bind this workspace to a Slack channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId, channelName]
              properties:
                channelId: { type: string }
                channelName: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
        '400':
          description: Missing fields, or Slack is not enabled for this deployment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
    delete:
      tags: [Workspaces]
      summary: Unbind the Slack channel
      responses:
        '200': { description: OK }
        '400':
          description: Slack is not enabled for this deployment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /workspaces/{id}/agent/model:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      summary: Ask the connected agent to switch model
      description: |
        A request, not a state change. The agent is asked over its MCP channel
        and answers with a fresh models notification once it has actually
        switched, which is the only thing that knows whether it did — so a
        `202` means asked, never settled.

        Only the model is named. Which session to address and which config
        option to write it to are resolved from what the agent itself reported,
        and are deliberately not the caller's to choose.

        Available only where `agentModels.canSet` is true on the workspace. An
        agent that reports what it is running but cannot be told to change it —
        every gateway older than this feature, and every client that never
        reports models at all — refuses with a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId]
              properties:
                modelId:
                  type: string
                  description: One of the ids the agent advertised in `agentModels.models`.
      responses:
        '202':
          description: The agent was asked to switch
          content:
            application/json:
              schema:
                type: object
                properties:
                  requested: { type: string }
        '400':
          description: No model named, or a model the agent does not offer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '403':
          description: Not your workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '404':
          description: No agent connected for this workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '409':
          description: The connected agent does not support choosing a model, or could not be reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /workspaces/{id}/agent/effort:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      summary: Ask the connected agent to switch reasoning level
      description: |
        A request, like choosing a model: `202` means asked, and the agent's
        next report says whether it switched. Available only where
        `agentEffort.canSet` is true on the workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effort]
              properties:
                effort:
                  type: string
                  description: One of the ids the agent offers in `agentEffort.efforts`.
      responses:
        '202':
          description: The agent was asked to switch
          content:
            application/json:
              schema:
                type: object
                properties:
                  requested: { type: string }
        '400':
          description: No level named, or a level the agent does not offer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '403':
          description: Not your workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '404':
          description: No agent connected for this workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '409':
          description: The connected agent does not support choosing a reasoning level, or could not be reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  # ── Tasks ───────────────────────────────────────────────────────────────────
  /tasks:
    get:
      tags: [Tasks]
      summary: List tasks across every workspace
      description: Same filters as the per-workspace list, without the workspace bound.
      parameters:
        - $ref: '#/components/parameters/TaskStatusFilter'
        - $ref: '#/components/parameters/TaskCreatedByFilter'
        - $ref: '#/components/parameters/TaskFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }

  /tasks/stats:
    get:
      tags: [Tasks]
      summary: Counts that drive the global badges
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pendingTasks: { type: integer, format: int64 }
                  scheduledTasks: { type: integer, format: int64 }

  /tasks/overview:
    get:
      tags: [Tasks]
      summary: Each workspace's task counts and first few active tasks
      description: |
        For every workspace of the user that has tasks: its counts, by the
        categories of `/workspaces/{id}/tasks/counts`, and up to 4 tasks in
        the order the workspace's Active list shows them (ongoing, blocked,
        not started in queue order, scheduled, then the most recently
        finished). What the workspaces page shows on each card, in one call.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaces:
                    type: array
                    items:
                      type: object
                      properties:
                        workspaceId: { type: string }
                        counts:
                          type: object
                          additionalProperties: { type: integer, format: int64 }
                        tasks:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string }
                              workspaceId: { type: string }
                              title: { type: string }
                              status: { type: string }
                              assignee: { type: string }
                              cronSchedule: { type: string }
                              createdAt: { type: string, format: date-time }
                              updatedAt: { type: string, format: date-time }

  /workspaces/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Tasks]
      summary: List tasks in a workspace
      parameters:
        - $ref: '#/components/parameters/TaskStatusFilter'
        - $ref: '#/components/parameters/TaskCreatedByFilter'
        - $ref: '#/components/parameters/TaskFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }
    post:
      tags: [Tasks]
      summary: Create a task
      description: |
        A `cronSchedule` makes the task recurring and sets its status to `cron`.
        The minute field must be a single fixed integer: granularity below
        hourly is rejected.

        `title` may be left out, and the task is then called `Untitled`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task: { $ref: '#/components/schemas/Task' }
                panoDocId:
                  type: string
                  description: A Pano doc of the account to link the task to as it is created; for a doc that is not found, no task is created.
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/counts:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Tasks]
      summary: Task counts by category
      description: |
        Categories collapse several statuses: `ongoing` also counts `blocked`,
        `scheduled` counts `cron`, and `completed` counts `rejected`.
        `blocked` counts blocked tasks on their own, and `queued` the
        not started tasks assigned to the agent.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer, format: int64 }
                properties:
                  notstarted: { type: integer, format: int64 }
                  ongoing: { type: integer, format: int64 }
                  scheduled: { type: integer, format: int64 }
                  completed: { type: integer, format: int64 }
                  pending: { type: integer, format: int64 }
                  blocked: { type: integer, format: int64 }
                  queued: { type: integer, format: int64 }

  /workspaces/{id}/tasks/{taskID}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Get a task, with its messages, latest tool calls and status history
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetailEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tasks]
      summary: Delete a task
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/tool-calls:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Page a task's tool calls, older than the latest ones a task is read with
      parameters:
        - name: before
          in: query
          required: false
          schema: { type: string }
          description: The id of a tool call; only calls made before it are returned. Leave it out for the latest.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 500 }
          description: How many tool calls to return; larger values are capped at 500. Leave it out, or 0, for 200.
      responses:
        '200':
          description: The calls, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [toolCalls]
                properties:
                  toolCalls:
                    type: array
                    items: { $ref: '#/components/schemas/ToolCall' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/plan:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Read the plan the task's agent is working to
      responses:
        '200':
          description: The plan, or null when the task has none
          content:
            application/json:
              schema:
                type: object
                required: [plan]
                properties:
                  plan:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/TaskPlan'
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/respond:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Answer a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                response:
                  type: object
                  properties:
                    action:
                      type: string
                      enum: [allow, reject, allow_all, text]
                    text: { type: string }
                    attachments:
                      type: array
                      items: { $ref: '#/components/schemas/Attachment' }
                    metadata: {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/fork:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Fork a task's conversation into a new task
      description: |
        Copies the task, and its messages from the first up to and including
        `messageId`, into a new task in the same workspace. Attachments are
        copied under new IDs. The new task is `ongoing` and handed to the agent
        at once when the agent has room for it, and `notstarted` otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageId]
              properties:
                messageId: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/reply:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Post a message to the task thread
      description: |
        Attachment bytes travel as base64 in `data`, inside this JSON body. The
        server mints the attachment ID and clears `data` before storing the
        metadata, so any `id` sent by the caller is ignored. The whole request
        is subject to the server's 4 MB body limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reply:
                  type: object
                  properties:
                    text: { type: string }
                    attachments:
                      type: array
                      items: { $ref: '#/components/schemas/Attachment' }
                    metadata: {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/status:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [Tasks]
      summary: Change a task's status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: object
                  properties:
                    value: { $ref: '#/components/schemas/TaskStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/order:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [Tasks]
      summary: Reorder a task on the board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: object
                  properties:
                    value: { type: number, format: double }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/assignee:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [Tasks]
      summary: Reassign a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignee:
                  type: object
                  properties:
                    value: { type: string, enum: [human, agent] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/title:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [Tasks]
      summary: Rename a task
      description: |
        Any status, but only in the first 7 days after the task was created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: object
                  properties:
                    value: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The task is more than 7 days old
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/workspace:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [Tasks]
      summary: Move a task to another workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace:
                  type: object
                  properties:
                    value:
                      type: string
                      description: Destination workspace ID (base62).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/allow_all:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [Tasks]
      summary: Toggle blanket command approval for a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowAll:
                  type: object
                  properties:
                    value: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/scheduled:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    put:
      tags: [Tasks]
      summary: Change or clear a task's schedule
      description: |
        Only tasks in `cron` or `notstarted` can be edited. An empty
        `cronSchedule` clears the schedule and returns the task to
        `notstarted`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task: { $ref: '#/components/schemas/Task' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/permission:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Allow or deny a pending tool call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, behavior]
              properties:
                requestId: { type: string }
                behavior: { type: string, enum: [allow, deny] }
      responses:
        '200': { description: Verdict delivered }
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '403':
          description: Not your task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '404':
          description: No agent connected for this workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '410':
          description: |
            The request expired — usually the server restarted. The agent has
            to ask again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /workspaces/{id}/tasks/{taskID}/elicitation:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Answer an agent's elicitation request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, action]
              properties:
                requestId: { type: string }
                action: { type: string, enum: [accept, decline, cancel] }
                content:
                  type: object
                  additionalProperties: true
      responses:
        '200': { description: Answer delivered }
        '400':
          description: Missing `requestId`, or an action outside the enum
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '403':
          description: Not your task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '404':
          description: No agent connected for this workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '410':
          description: The agent stopped waiting, or the server restarted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /workspaces/{id}/tasks/{taskID}/a2ui/actions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Answer an agent's card by clicking one of its Buttons
      description: |
        Posts the click as the person's reply, as `/reply` does, and hands it
        to the agent the same way. The reply's text is `userMessage`, else the
        Button's own `userMessage`, else its label, else `name`; its metadata
        is `{"a2uiAction": {messageId, surfaceId, name, context}}`. The card's
        message is marked `answered: {name, at}`: a card is answered once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageId, surfaceId, name, sourceComponentId]
              properties:
                messageId: { type: string, description: The agent's message that carries the card }
                surfaceId: { type: string }
                name: { type: string, description: "The Button's `action.event.name`" }
                sourceComponentId: { type: string, description: The Button's component id }
                context:
                  type: object
                  additionalProperties: true
                  description: "The Button's `action.event.context`, its bindings resolved"
                userMessage: { type: string, description: "The Button's `action.event.userMessage`, resolved" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '404':
          description: No such task, or no such message in it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: The card is already answered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: A request it cannot read, a message with no card, or no Button with that action on it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workspaces/{id}/tasks/{taskID}/stop:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Ask the agent to stop working on a task
      description: |
        A message to the agent, not a state change: the task's own status is
        untouched, and the agent decides what happens next.
      responses:
        '200':
          description: The agent acted on the request
          content:
            application/json:
              schema:
                type: object
                properties:
                  stopped: { type: boolean }
                  approvalsDenied: { type: integer }
        '400':
          description: Invalid task id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '403':
          description: Not your task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '404':
          description: No agent connected for this workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '409':
          description: Nothing was stopped, either because the connected agent cannot be stopped or because it has nothing running for this task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  # ── Attachments ─────────────────────────────────────────────────────────────
  /workspaces/{id}/tasks/{taskID}/attachments/{attachmentID}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
      - name: attachmentID
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Attachments]
      summary: Download an attachment
      description: |
        Streams the raw bytes — not base64 — with the stored MIME type and a
        `Content-Disposition` filename. Both task-level and message-level
        attachments are searched, and the task's owner is verified first, so an
        attachment on someone else's task is a 404 rather than a 403.
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  # ── Events ──────────────────────────────────────────────────────────────────
  /events:
    get:
      tags: [Events]
      summary: List events
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
    post:
      tags: [Events]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                payloadGuidelines: { type: string }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /events/{id}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      summary: Get an event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Events]
      summary: Update an event's payload guidelines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payloadGuidelines: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
    delete:
      tags: [Events]
      summary: Delete an event
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/triggers:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      summary: List the triggers subscribed to an event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventTriggers:
                    type: array
                    items: { $ref: '#/components/schemas/EventTrigger' }
    post:
      tags: [Events]
      summary: Subscribe a workspace to an event
      description: |
        `{{EVENT_PAYLOAD}}` and `{{EVENT_FAQ}}` are substituted into `body`
        when the trigger fires. The title is static text and is never
        substituted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventTriggerInput' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventTrigger: { $ref: '#/components/schemas/EventTrigger' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /events/{id}/triggers/{triggerID}:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - name: triggerID
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Events]
      summary: Update a trigger
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventTriggerInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventTrigger: { $ref: '#/components/schemas/EventTrigger' }
    delete:
      tags: [Events]
      summary: Delete a trigger
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      summary: Tasks spawned by this event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }

  # ── Hooks ───────────────────────────────────────────────────────────────────
  /hooks:
    get:
      tags: [Hooks]
      summary: List the hooks this account can register
      description: The enabled built-in hooks, and the account's own when the server allows them.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  hooks:
                    type: array
                    items: { $ref: '#/components/schemas/Hook' }
                  allowUserHooks:
                    type: boolean
                    description: Whether the account may add hooks of its own (`hooks.allowUserHooks`).
    post:
      tags: [Hooks]
      summary: Add a hook of the account's own
      description: |
        The module, `application/wasm`. Send it with `Content-Encoding: gzip`: a Go
        hook is over the 4 MB request limit, and is unpacked to at most 16 MiB.
        Refused (403) while the server does not allow accounts' own hooks.
      requestBody:
        required: true
        content:
          application/wasm:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hook' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '409': { description: The account already has a hook of this name. }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /hooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: One of the account's own hooks (base62).
    put:
      tags: [Hooks]
      summary: Upgrade one of the account's own hooks
      description: A new version of the same hook, sent as on create. Refused when it would break a registration.
      requestBody:
        required: true
        content:
          application/wasm:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hook' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The upgrade would break a registration. }
        '422': { $ref: '#/components/responses/InvalidPayload' }
    delete:
      tags: [Hooks]
      summary: Delete one of the account's own hooks
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A registration still uses it. }

  /hooks/registrations:
    get:
      tags: [Hooks]
      summary: List the account's hook registrations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  registrations:
                    type: array
                    items: { $ref: '#/components/schemas/HookRegistration' }
    post:
      tags: [Hooks]
      summary: Register a hook
      description: The answer carries `urlWithToken`, the only time the token is shown.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HookRegistrationRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HookRegistration' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /hooks/registrations/{id}:
    parameters:
      - $ref: '#/components/parameters/HookRegistrationId'
    get:
      tags: [Hooks]
      summary: Get a hook registration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HookRegistration' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Hooks]
      summary: Change a hook registration
      description: A field left out is kept, and so is a secret input left out of `inputs`. The hook cannot change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HookRegistrationRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HookRegistration' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }
    delete:
      tags: [Hooks]
      summary: Delete a hook registration, and its deliveries
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /hooks/registrations/{id}/rotateToken:
    parameters:
      - $ref: '#/components/parameters/HookRegistrationId'
    post:
      tags: [Hooks]
      summary: Replace a registration's token
      description: The old URL stops working; the answer carries the new `urlWithToken`, shown only this once.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HookRegistration' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hooks/registrations/{id}/deliveries:
    parameters:
      - $ref: '#/components/parameters/HookRegistrationId'
    get:
      tags: [Hooks]
      summary: A registration's deliveries, newest first
      description: Deliveries are kept for `hooks.deliveryRetention`. A delivery's request is never returned.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: before
          in: query
          required: false
          schema: { type: string }
          description: A delivery id; the page starts after it.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items: { $ref: '#/components/schemas/HookDelivery' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hooks/registrations/{id}/deliveries/{deliveryId}/replay:
    parameters:
      - $ref: '#/components/parameters/HookRegistrationId'
      - name: deliveryId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Hooks]
      summary: Queue a failed delivery again
      responses:
        '204': { description: Queued }
        '404': { $ref: '#/components/responses/NotFound' }

  /hooks/in/{id}:
    parameters:
      - $ref: '#/components/parameters/HookRegistrationId'
      - name: agentrq_hook_token
        in: query
        required: true
        schema: { type: string, pattern: '^[0-9a-z]{8}$' }
        description: The registration's token. It is removed before the request is stored, so the hook never sees it.
    post:
      tags: [Hooks]
      summary: Send a request to a hook
      description: |
        The URL an outside service calls. It takes no session: the token is the
        credential. The request is checked and queued, then answered; the hook runs
        afterwards, so a request the hook refuses (a wrong signature, say) is still
        202 here and shows as rejected in the registration's deliveries.
      security: []
      requestBody:
        content:
          '*/*':
            schema: { type: string, format: binary, maxLength: 1048576 }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveryId: { type: string }
        '404': { description: 'No such registration, turned off, or a wrong token: the three answer alike.' }
        '413': { description: The body is over 1 MiB. }
        '429': { description: 'Too many wrong tokens from this address, too many requests to this URL in a minute, or too many waiting.' }

  # ── Workflows ───────────────────────────────────────────────────────────────
  /workflows:
    get:
      tags: [Workflows]
      summary: List workflows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflows:
                    type: array
                    items: { $ref: '#/components/schemas/Workflow' }
    post:
      tags: [Workflows]
      summary: Create a workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                startEventId: { type: string }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow: { $ref: '#/components/schemas/Workflow' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workflows/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      summary: Get a workflow
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow: { $ref: '#/components/schemas/Workflow' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Workflows]
      summary: Update a workflow
      description: |
        Every field is optional and an omitted one is left alone — saving a
        canvas layout must not blank the name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                startEventId: { type: string }
                layout:
                  description: Opaque canvas state, stored and returned verbatim.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow: { $ref: '#/components/schemas/Workflow' }
    delete:
      tags: [Workflows]
      summary: Delete a workflow and its steps
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /workflows/{id}/steps:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      summary: List a workflow's steps
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflowSteps:
                    type: array
                    items: { $ref: '#/components/schemas/WorkflowStep' }
    post:
      tags: [Workflows]
      summary: Add a step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId: { type: string }
                workspaceId: { type: string }
                emitEventId: { type: string }
                title: { type: string }
                body: { type: string }
                assignee: { type: string, enum: [human, agent] }
                allowAllCommands: { type: boolean }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflowStep: { $ref: '#/components/schemas/WorkflowStep' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workflows/{id}/steps/{stepID}:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - name: stepID
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Workflows]
      summary: Delete a step
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /workflows/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      summary: Tasks spawned by this workflow
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }

  /workflows/{id}/text:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      summary: The workflow as editable text
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
    put:
      tags: [Workflows]
      summary: Replace the workflow from text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow: { $ref: '#/components/schemas/Workflow' }
                  stepCount: { type: integer }
        '400':
          description: |
            Parse or validation failure. Carries the offending source line so
            the editor can mark the row rather than showing a bare message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message: { type: string }
                      line: { type: integer }

  # ── Push notifications ──────────────────────────────────────────────────────
  /push/vapid-public-key:
    get:
      tags: [Push]
      summary: The VAPID public key for Web Push
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicKey: { type: string }

  /push/subscription:
    get:
      tags: [Push]
      summary: Whether an endpoint is subscribed for a workspace
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema: { type: string }
        - name: endpoint
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscribed: { type: boolean }
        '403':
          description: Not your workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '422': { $ref: '#/components/responses/InvalidPayload' }
    delete:
      tags: [Push]
      summary: Remove every subscription for a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceId: { type: string }
      responses:
        '204': { description: Deleted }
        '403':
          description: Not your workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /push/subscribe:
    post:
      tags: [Push]
      summary: Subscribe a browser endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys, workspaceId]
              properties:
                endpoint: { type: string }
                keys:
                  type: object
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
                workspaceId: { type: string }
                types:
                  type: array
                  items: { type: string }
                  description: Omit or leave empty for every notification type.
      responses:
        '201':
          description: Subscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: subscribed }
        '403':
          description: Not your workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '422': { $ref: '#/components/responses/InvalidPayload' }
    delete:
      tags: [Push]
      summary: Unsubscribe one endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint: { type: string }
      responses:
        '204': { description: Unsubscribed }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  # ── Telemetry ───────────────────────────────────────────────────────────────
  /telemetry:
    post:
      tags: [Telemetry]
      summary: Record one client-side action
      description: |
        `action` comes from a fixed allowlist rather than being free text, and
        there is deliberately no field for a count, a timestamp or a payload:
        the server decides when the event happened and what one call is worth,
        so a caller cannot backdate an event or claim a thousand at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, workspaceId]
              properties:
                action: { type: string }
                workspaceId: { type: string }
      responses:
        '204': { description: Recorded }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  # ── Browser ─────────────────────────────────────────────────────────────────
  /browser/ticket:
    post:
      tags: [Browser]
      summary: Mint a ticket for the browser socket
      description: |
        For the AgentRQ Chrome extension, whose origin never receives the `at`
        cookie. The ticket is good for one connect, within `expiresIn` seconds.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expiresIn]
                properties:
                  ticket: { type: string }
                  expiresIn: { type: integer, description: Seconds. }

  /browser/connect:
    get:
      tags: [Browser]
      summary: The Chrome extension's WebSocket
      description: |
        Carries the shared sites' WebMCP tools and the calls to them, as JSON
        frames. Authenticated by the ticket, not the cookie. Served by the
        standard-library mux, because a WebSocket upgrade must hijack the
        connection.
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema: { type: string }
          description: From `POST /browser/ticket`.
        - name: browser
          in: query
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9-]{1,64}$' }
          description: The extension's own id for this Chrome profile.
      responses:
        '101': { description: Switching protocols }
        '400': { description: Bad browser id, or not a WebSocket upgrade }
        '401': { description: Missing or invalid ticket }

  # ── Streaming ───────────────────────────────────────────────────────────────
  /events/stream:
    get:
      tags: [Streaming]
      summary: Server-sent events across every workspace
      description: |
        Long-lived `text/event-stream`. Authenticated by the `at` cookie like
        every other route.

        Event types: `task.created`, `task.updated`, `task.deleted`,
        `status.updated`, `reply.received`, `respond.ack`, `agent.connected`,
        `toolCall.updated` (one tool call, `{workspaceId, toolCall}`).

        It also carries the task events of the workspaces shared with your
        teams, as `team.task.created`, `team.task.updated`,
        `team.task.deleted`, `team.status.updated` and `team.reply.received`,
        each with the `teamId` it is shown in; a task in one comes as the
        team's task list shows it, with `owner` and `sharedName`, its files linked
        through the team's attachment route. Who reads a
        workspace is checked at every event, so they stop as soon as it is
        unshared or archived, or you leave the team.

        Served by the standard-library mux rather than by Fiber, because Fiber's
        response buffering is unsuited to a stream that never ends.
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { description: Unauthenticated }

  /workspaces/{id}/events:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Streaming]
      summary: Server-sent events for one workspace
      description: |
        The same stream as `/events/stream`, narrowed to one workspace. Also
        served by the standard-library mux, which takes exact path matches
        ahead of Fiber.
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { description: Unauthenticated }

  /teams:
    get:
      tags: [Teams]
      summary: List the teams the account is in
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                type: object
                properties:
                  teams:
                    type: array
                    items: { $ref: '#/components/schemas/Team' }
    post:
      tags: [Teams]
      summary: Create a team, with the account its first member
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamNameRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '422': { $ref: '#/components/responses/TeamRefused' }

  /teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      summary: Get a team
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Teams]
      summary: Rename a team
      description: Any member, from the version they loaded (`version`, required); 409 when the team changed first.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamNameRequest' }
      responses:
        '200':
          description: OK, at the new version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamVersionConflict' }
        '422': { $ref: '#/components/responses/TeamRefused' }
    delete:
      tags: [Teams]
      summary: Delete a team with its members, invitations and shares
      description: Any member. Its activity is kept.
      parameters:
        - $ref: '#/components/parameters/TeamVersion'
      responses:
        '204': { description: Done }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamVersionConflict' }

  /teams/{teamId}/members:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      summary: List a team's members
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                type: object
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/TeamMember' }
                  version: { type: integer, format: int64, description: The team's version. }
        '404': { $ref: '#/components/responses/NotFound' }

  /teams/{teamId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/TeamUserId'
    delete:
      tags: [Teams]
      summary: Remove a member
      description: Any member; removing yourself is leaving (204). The member's workspaces are unshared from the team; the last member to go deletes it.
      parameters:
        - $ref: '#/components/parameters/TeamVersion'
      responses:
        '200': { $ref: '#/components/responses/TeamVersion' }
        '204': { description: You left }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamVersionConflict' }

  /teams/{teamId}/leave:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    post:
      tags: [Teams]
      summary: Leave a team
      description: Unshares the account's workspaces from the team. The last member to leave deletes it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamVersionRequest' }
      responses:
        '204': { description: Done }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamVersionConflict' }

  /teams/{teamId}/invitations:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      summary: List a team's pending invitations
      description: Any member.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                type: object
                properties:
                  invitations:
                    type: array
                    items: { $ref: '#/components/schemas/TeamInvitation' }
                  version: { type: integer, format: int64, description: The team's version. }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Teams]
      summary: Invite an email address to a team
      description: Any member, from the version they loaded. The answer is the same whether or not the address has an account. A team creates at most `teams.maxInvitesPerDay` invitations in any 24 hours, and one account at most `teams.maxInvitesPerUserPerDay` across all its teams (429, saying which cap); revoked and declined ones count. A team cap of 0 turns invitations off (403); a per-account cap of 0 is none.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTeamInvitationRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateTeamInvitationResponse' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '403': { $ref: '#/components/responses/TeamRefused' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The address already has a pending invitation or is in the team (TeamRefused), or the team changed first (with `conflict` and `version`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamConflictResponse' }
        '422': { $ref: '#/components/responses/TeamRefused' }
        '429': { $ref: '#/components/responses/TeamRefused' }

  /teams/{teamId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags: [Teams]
      summary: Revoke a pending invitation
      description: Any member.
      parameters:
        - $ref: '#/components/parameters/TeamVersion'
      responses:
        '200': { $ref: '#/components/responses/TeamVersion' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamVersionConflict' }

  /teams/{teamId}/activities:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      summary: List a team's activity
      description: Every change to the team, newest first, a page at a time. Any member; 404 otherwise.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, maximum: 100 }
        - name: before
          in: query
          required: false
          schema: { type: string }
          description: The id of the last activity seen; the page holds those older than it.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  activities:
                    type: array
                    items: { $ref: '#/components/schemas/TeamActivity' }
                  version: { type: integer, format: int64, description: The team's version. }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invitations:
    get:
      tags: [Teams]
      summary: List the invitations waiting for the account's email
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                type: object
                properties:
                  invitations:
                    type: array
                    items: { $ref: '#/components/schemas/TeamInvitation' }

  /invitations/preview:
    post:
      tags: [Teams]
      summary: Show what an invitation link is for
      description: The token is the part of the link after `#`. Gone (410) as accepting it would be.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInvitationTokenRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamInvitationPreview' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/TeamRefused' }

  /invitations/accept:
    post:
      tags: [Teams]
      summary: Accept an invitation by its link's token
      description: The account's email must be the invited address, ignoring case (403). Works once, within 7 days, and only while the inviter is still in the team (410).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInvitationTokenRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '403': { $ref: '#/components/responses/TeamRefused' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/TeamRefused' }

  /invitations/{invitationId}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [Teams]
      summary: Accept one of the account's invitations
      description: Works once, within 7 days, and only while the inviter is still in the team (410).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/TeamRefused' }

  /invitations/{invitationId}/decline:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [Teams]
      summary: Decline one of the account's invitations
      responses:
        '204': { description: Done }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/TeamRefused' }

  /workspaces/{id}/shares:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Teams]
      summary: List the teams a workspace is shared with
      description: The workspace's owner only.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                type: object
                properties:
                  shares:
                    type: array
                    items: { $ref: '#/components/schemas/WorkspaceShare' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{id}/shares/{teamId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TeamId'
    put:
      tags: [Teams]
      summary: Share a workspace with a team
      description: The workspace's owner, in the team, from the team's version. It shows there by its own name, as one team workspace with every shared workspace of that name. Forks follow their parent and archived workspaces cannot be shared (422). On a workspace already shared, it sets which of its tasks and memory the team reads.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareWorkspaceRequest' }
      responses:
        '200':
          description: OK, with the team's new `version`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceShare' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamVersionConflict' }
        '422': { $ref: '#/components/responses/TeamRefused' }
    delete:
      tags: [Teams]
      summary: Stop sharing a workspace with a team
      parameters:
        - $ref: '#/components/parameters/TeamVersion'
      responses:
        '200': { $ref: '#/components/responses/TeamVersion' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamVersionConflict' }

  /pano/{id}/shares:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Pano doc ID (base62).
    get:
      tags: [Teams]
      summary: List the teams a Pano doc is shared with
      description: The doc's owner only (404 otherwise, or once it expired).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  shares:
                    type: array
                    items: { $ref: '#/components/schemas/PanoDocShare' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pano/{id}/shares/{teamId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Pano doc ID (base62).
      - $ref: '#/components/parameters/TeamId'
    put:
      tags: [Teams]
      summary: Share a Pano doc with a team
      description: The doc's owner, in the team, from the team's version. The team's members read it, and its files, read-only, until it is unshared, its owner leaves the team, or the doc is deleted or expires.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamVersionRequest' }
      responses:
        '200':
          description: OK, with the team's new `version`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanoDocShare' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamVersionConflict' }
    delete:
      tags: [Teams]
      summary: Stop sharing a Pano doc with a team
      parameters:
        - $ref: '#/components/parameters/TeamVersion'
      responses:
        '200': { $ref: '#/components/responses/TeamVersion' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamVersionConflict' }

  /workspaces/{id}/teammate-memories:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Teams]
      summary: List the teammates whose memory a workspace's agent reads
      description: The workspace's owner only (404 otherwise). In a workspace shared with a team, the agent's memory index lists every teammate's memory in its team workspace (the shared workspaces of its name); this is one row per teammate's workspace there, yours left out, and whether the index includes it. Everyone is included until you leave them out.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  teammates:
                    type: array
                    items: { $ref: '#/components/schemas/TeammateMemory' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{id}/teammate-memories/{userId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TeamUserId'
    put:
      tags: [Teams]
      summary: Include a teammate's memory in a workspace's memory index, or leave it out
      description: Changes only what your own workspace's agent reads; the teammate sees no change. 404 for a workspace not yours, or someone who does not share its team workspace now.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [included]
              properties:
                included: { type: boolean }
      responses:
        '200':
          description: OK, the teammate as now set
          content:
            application/json:
              schema:
                type: object
                properties:
                  teammate: { $ref: '#/components/schemas/TeammateMemory' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{id}/teammate-memories/{teammateWorkspaceId}/memories:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: teammateWorkspaceId
        in: path
        required: true
        schema: { type: string }
        description: A teammate's workspace, as the teammate list names it.
    get:
      tags: [Teams]
      summary: List a teammate's memories, read-only
      description: Without their content. Your own workspace's owner only, and a teammate's workspace in its team workspace whose share includes memory, whether or not your agent's index includes it (404 otherwise).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  memories:
                    type: array
                    items: { $ref: '#/components/schemas/Memory' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{id}/teammate-memories/{teammateWorkspaceId}/memories/{name}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: teammateWorkspaceId
        in: path
        required: true
        schema: { type: string }
        description: A teammate's workspace, as the teammate list names it.
      - name: name
        in: path
        required: true
        schema: { type: string, maxLength: 32 }
        description: The memory's name, as the teammate's agent saved it.
    get:
      tags: [Teams]
      summary: One of a teammate's memories, in full, read-only
      description: The same checks as the list (404 otherwise).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  memory: { $ref: '#/components/schemas/Memory' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teams/{teamId}/workspaces:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Team mode]
      summary: List the workspaces a team reads
      description: The workspaces its members shared with it, and their forks, none archived, by `sharedName` (ignoring case), then name. The shared workspaces of one name, ignoring case and surrounding spaces, are one team workspace; a fork shows under its parent's. 404 unless you are in the team.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaces:
                    type: array
                    items: { $ref: '#/components/schemas/TeamWorkspace' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teams/{teamId}/tasks:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Team mode]
      summary: List the tasks of a team's workspaces
      description: Newest activity first, each with its owner and `sharedName`.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
          description: Comma-separated statuses.
        - name: workspace
          in: query
          required: false
          schema: { type: string }
          description: Only this team workspace, by its shared name, matched ignoring case and surrounding spaces.
        - name: member
          in: query
          required: false
          schema: { type: string }
          description: Only this member's workspaces (their user ID, base62).
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 10, maximum: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/TeamTask' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teams/{teamId}/analytics:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Team mode]
      summary: Activity statistics of a team's workspaces
      description: A workspace's statistics, in its shape, summed over every workspace the team reads, or over one team workspace's.
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: ['1d', '7d', 'week', '30d', 'month', 'custom']
            default: '7d'
        - name: from
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Unix timestamp. Used only when `range=custom`.
        - name: to
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Unix timestamp. Used only when `range=custom`.
        - name: workspace
          in: query
          required: false
          schema: { type: string }
          description: Only this team workspace, by its shared name, matched ignoring case and surrounding spaces.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceStats' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teams/{teamId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/TeamTaskId'
    get:
      tags: [Team mode]
      summary: Read a teammate's task
      description: What the owner's task page reads (the task with its conversation and tool calls, its history and timing), read-only, with its workspace, owner and plan. Never the owner's Pano docs. 404 once its workspace is no longer shared with the team.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamTaskDetail' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teams/{teamId}/tasks/{taskId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/TeamTaskId'
      - name: attachmentId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Team mode]
      summary: Download an attachment of a teammate's task
      description: >-
        The raw bytes, as the owner's own attachment route serves them. Every file of a task in team mode is linked here, never by its public link, so a teammate's access ends with the share. A type a browser could run (HTML, SVG…) comes as `application/octet-stream` with `Content-Disposition: attachment`; every file is sent with `X-Content-Type-Options: nosniff` and a sandbox CSP.
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teams/{teamId}/tasks/{taskId}/clone:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/TeamTaskId'
    post:
      tags: [Team mode]
      summary: Clone a teammate's task into one of your workspaces
      description: Creates a task in `workspaceId`, which must be yours (404 otherwise), as creating one does, not started, with the title, the body and the task's own attachments, and a note linking back to the original. `assignee` is `human` (the default) or `agent` (422 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId]
              properties:
                workspaceId: { type: string }
                assignee: { type: string, enum: [human, agent], default: human }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/TeamRefused' }

  /teams/{teamId}/pano:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Team mode]
      summary: List the Pano docs shared with a team
      description: Without their markdown, the most recently updated first, each with its owner. An expired doc is left out.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  docs:
                    type: array
                    items: { $ref: '#/components/schemas/TeamPanoDoc' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teams/{teamId}/pano/{docId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - name: docId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Team mode]
      summary: Read a Pano doc shared with a team
      description: Read-only, with its markdown, files and attachments. Every file is linked by the team's route, never its public link; there are no comments, tasks or writing workspaces, which name the owner's workspaces. 404 once it is no longer shared with the team.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  doc: { $ref: '#/components/schemas/TeamPanoDoc' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teams/{teamId}/pano/{docId}/files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - name: docId
        in: path
        required: true
        schema: { type: string }
      - name: fileId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Team mode]
      summary: Download a file of a Pano doc shared with a team
      description: The raw bytes, sandboxed as a teammate's task attachment is.
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{id}/team-skills:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: q
        in: query
        required: false
        schema: { type: string }
        description: Only skills whose name or description contains this, ignoring case.
    get:
      tags: [Workspaces]
      summary: The team skills this workspace reaches
      description: >
        The skills of every team workspace this workspace is shared into, by
        name, each with whether the workspace is opted into it (`on`) and
        whether one of the account's own skills of its name, on in this
        workspace, wins over it (`clash`). `teamWorkspaces` is the team
        workspaces it is shared into. A fork answers for its parent.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  skills:
                    type: array
                    items: { $ref: '#/components/schemas/TeamWorkspaceSkill' }
                  teamWorkspaces:
                    type: array
                    items: { $ref: '#/components/schemas/TeamWorkspaceRef' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{id}/team-skills/{skillId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TeamSkillId'
    put:
      tags: [Workspaces]
      summary: Opt this workspace into, or out of, a team skill
      description: >
        Opted in, the workspace's agent sees the skill and can change it.
        Opting out sticks: a change to the skill never opts the workspace
        back in. Unlike an agent's delete, opting out never deletes the skill.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on]
              properties:
                on: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamWorkspaceSkillResponse' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{id}/skills/{name}/give:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SkillName'
    post:
      tags: [Workspaces]
      summary: Give one of the account's skills to a team workspace
      description: >
        Moves the skill, keeping its id, into a team workspace this workspace
        is shared into: it stops being the account's, and every workspace
        opted into the team's skills gets it. Its files lose their public
        links. 409 when the team workspace has a skill of that name; 422 when
        it is full, or the skill is a link to a teammate's.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamWorkspaceId]
              properties:
                teamWorkspaceId: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamWorkspaceSkillResponse' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidPayload' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /teams/{teamId}/team-workspaces/{teamWorkspaceId}/skills:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/TeamWorkspaceId'
    get:
      tags: [Team mode]
      summary: A team workspace's skills
      description: By name. The team's skills belong to no member, so they outlive any one of them.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  skills:
                    type: array
                    items: { $ref: '#/components/schemas/TeamWorkspaceSkill' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Team mode]
      summary: Create a team skill from its SKILL.md
      description: Named by its frontmatter. 409 when the team workspace has a skill of that name; 422 when it is full or the SKILL.md is not valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamWorkspaceSkillFileResponse' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidPayload' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /teams/{teamId}/team-workspaces/{teamWorkspaceId}/skills/import:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/TeamWorkspaceId'
    post:
      tags: [Team mode]
      summary: Import skills from a GitHub or GitLab repository into a team workspace
      description: As `/skills/import` does into the account, a private GitHub repository through the importing member's own GitHub connection, a private GitLab project through their own GitLab connection. A name the team workspace has already is skipped unless `overwrite`; one over its cap is skipped with the reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
                overwrite: { type: boolean, default: false }
                skills:
                  type: array
                  maxItems: 256
                  items: { type: string }
      responses:
        '200':
          description: What was imported, and what was left out
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: array
                    items: { $ref: '#/components/schemas/TeamWorkspaceSkill' }
                  skipped:
                    type: array
                    items: { type: object, properties: { name: { type: string }, path: { type: string }, reason: { type: string } } }
                  candidates:
                    type: array
                    items: { type: object, properties: { name: { type: string }, path: { type: string }, sizeBytes: { type: integer }, reason: { type: string } } }
                  sourceRepo: { type: string }
                  sourceRef: { type: string }
                  sourceCommit: { type: string }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }
        '502': { $ref: '#/components/responses/InvalidPayload' }

  /teams/{teamId}/team-workspaces/{teamWorkspaceId}/skills/{skillId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/TeamWorkspaceId'
      - $ref: '#/components/parameters/TeamSkillId'
    get:
      tags: [Team mode]
      summary: One team skill, with its list of files
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamWorkspaceSkillResponse' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Team mode]
      summary: Delete a team skill for everyone
      description: Every workspace loses it, opted in or not.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teams/{teamId}/team-workspaces/{teamWorkspaceId}/skills/{skillId}/files/{path}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/TeamWorkspaceId'
      - $ref: '#/components/parameters/TeamSkillId'
      - name: path
        in: path
        required: true
        schema: { type: string, maxLength: 255 }
        description: The file's path from the skill's root. It is the rest of the URL, so it may contain `/`.
    get:
      tags: [Team mode]
      summary: One file of a team skill, with its content and version
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamWorkspaceSkillFileResponse' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Team mode]
      summary: Write a file of a team skill
      description: >
        `version`, the one read, is required to replace a file, so nobody's
        change is lost: a stale one answers 409 with the current version.
        Leave it out to add a file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                version: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamWorkspaceSkillFileResponse' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidPayload' }
        '422': { $ref: '#/components/responses/InvalidPayload' }
    delete:
      tags: [Team mode]
      summary: Delete a file of a team skill
      description: A skill cannot lose its SKILL.md; delete the skill instead.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamWorkspaceSkillResponse' }
        '400': { $ref: '#/components/responses/InvalidPayload' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: at
      description: Access token cookie, set by any of the `/auth` login flows.

  parameters:
    WorkspaceId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Workspace ID (base62).
    TaskId:
      name: taskID
      in: path
      required: true
      schema: { type: string }
      description: Task ID (base62).
    EventId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Event ID (base62).
    HookRegistrationId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Hook registration ID (base62).
    WorkflowId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Workflow ID (base62).
    TaskStatusFilter:
      name: status
      in: query
      required: false
      schema: { type: string }
      description: Comma-separated list of statuses, e.g. `ongoing,blocked`.
    TaskCreatedByFilter:
      name: created_by
      in: query
      required: false
      schema: { type: string, enum: [human, agent] }
      description: |
        Note the snake_case spelling — this query parameter predates the
        camelCase convention that governs JSON bodies.
    TaskFilter:
      name: filter
      in: query
      required: false
      schema: { type: string, enum: [pending_approval] }
      description: Named filter. `pending_approval` selects tasks whose most recent message is a permission request.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 10, maximum: 50 }
      description: Clamped server-side to 50; a value of 0 or less falls back to 10.
    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, default: 0 }
    SkillName:
      name: name
      in: path
      required: true
      schema: { type: string, maxLength: 64, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
      description: The skill's name, unique among the skills a workspace can use.
    TeamWorkspaceId:
      name: teamWorkspaceId
      in: path
      required: true
      schema: { type: string }
      description: Team workspace ID (base62), a workspace's `teamWorkspaceId` in the team's list.
    TeamSkillId:
      name: skillId
      in: path
      required: true
      schema: { type: string }
      description: Team skill ID (base62).
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: string }
      description: Team ID (base62).
    TeamVersion:
      name: version
      in: query
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      description: The team's version the change is made from (400 when missing).
    TeamUserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
      description: The member's account ID (base62).
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string }
      description: Invitation ID (base62).
    TeamTaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
      description: Task ID (base62).

  responses:
    TeamVersion:
      description: Done; the team's version after the change.
      content:
        application/json:
          schema:
            type: object
            properties:
              version: { type: integer, format: int64 }
    TeamVersionConflict:
      description: The team changed after the version the change was made from. Reload it at `version` and try again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TeamConflictResponse' }
    TeamRefused:
      description: A team request refused; the message says why.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidPayload:
      description: Invalid request payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AccessDenied:
      description: Access denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    GitLabConnection:
      type: object
      properties:
        host: { type: string, example: gitlab.com, description: The GitLab links to import from may name. }
        enabled: { type: boolean, description: Whether the account can connect GitLab, for its private projects. }
        authorizeUrl: { type: string, description: Where to approve the connection on GitLab; set while enabled. }
        username: { type: string, description: The GitLab account connected; absent when none is. }
    GitHubConnection:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether the server has a GitHub App; false, nothing else is set.
        installUrl:
          type: string
          description: Where to install the app, or change which repositories it reads.
        installations:
          type: array
          items:
            type: object
            properties:
              installationId: { type: integer, format: int64 }
              account: { type: string, example: acme }
              accountType: { type: string, enum: [User, Organization] }
              createdAt: { type: string, format: date-time }
    TeamOwner:
      type: object
      properties:
        userId: { type: string }
        name: { type: string }
        picture: { type: string }
    TeammateMemory:
      type: object
      properties:
        userId: { type: string }
        name: { type: string }
        picture: { type: string }
        workspaceId: { type: string, description: The teammate's workspace in the team workspace. }
        updatedAt: { type: string, format: date-time, description: When a memory there was last written; absent when none was. }
        included: { type: boolean, description: Whether your workspace's agent's memory index includes it. }
    TeamWorkspace:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        sharedName: { type: string, description: The name of the shared workspace it shows under, its own or its parent's for a fork. The shared workspaces of one name, ignoring case and surrounding spaces, are one team workspace. }
        owner: { $ref: '#/components/schemas/TeamOwner' }
        forkOfId: { type: string, description: The parent, for a fork. }
        teamWorkspaceId: { type: string, description: 'The team workspace it is shared into, whose skills are at `/teams/{teamId}/team-workspaces/{teamWorkspaceId}/skills`.' }
    TeamTask:
      description: A task in team mode. The `url` of each of its files, and of its messages' files, is the team's attachment route.
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          properties:
            owner: { $ref: '#/components/schemas/TeamOwner' }
            sharedName: { type: string }
    TeamTaskDetail:
      type: object
      properties:
        task: { $ref: '#/components/schemas/Task' }
        stateTransitions:
          type: array
          items: { $ref: '#/components/schemas/TaskStateTransition' }
        timing: { $ref: '#/components/schemas/TaskTiming' }
        workspace: { $ref: '#/components/schemas/TeamWorkspace' }
        owner: { $ref: '#/components/schemas/TeamOwner' }
        plan:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TaskPlan'
    TeamActivity:
      type: object
      properties:
        id: { type: string }
        action:
          type: string
          enum: [team.created, team.renamed, member.invited, invitation.revoked, invitation.accepted, invitation.declined, member.removed, member.left, workspace.shared, workspace.shareChanged, workspace.unshared, team.deleted]
        actor: { $ref: '#/components/schemas/TeamOwner' }
        targetUser: { $ref: '#/components/schemas/TeamOwner' }
        targetEmail: { type: string }
        targetWorkspaceId: { type: string }
        details:
          type: object
          additionalProperties: { type: string }
          description: 'A rename''s `from` and `to`, a share''s `workspaceName` and its `tasks`, `skills` and `memory` (`on` or `off`), a deleted team''s `name`.'
        createdAt: { type: string, format: date-time }
    TeamConflictResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            code: { type: integer }
        conflict: { type: boolean }
        version: { type: integer, format: int64, description: The team's version now. }
    ErrorResponse:
      type: object
      description: The structured envelope returned by handlers that map a domain error.
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            code: { type: integer }

    SimpleError:
      type: object
      description: |
        The flat shape returned by handlers that validate inline. Both forms
        are live; each operation above names which one it returns.
      properties:
        error: { type: string }

    AuthenticatedUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        picture: { type: string }

    Workspace:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: string }
        description:
          type: string
          description: The workspace's mission, shown to the agent.
        archivedAt: { type: string, format: date-time, nullable: true }
        icon: { type: string }
        notificationSettings: { $ref: '#/components/schemas/NotificationSettings' }
        agentConnected:
          type: boolean
          description: Whether an agent currently holds an MCP session.
        agentSupportsStop: { type: boolean }
        agentModels:
          allOf: [{ $ref: '#/components/schemas/AgentModels' }]
          description: |
            What the connected agent can switch between. Absent when no agent is
            connected, or when the connected one has not reported any, so its
            presence means a choice exists.
        agentEffort:
          allOf: [{ $ref: '#/components/schemas/AgentEffort' }]
          description: |
            The reasoning levels the connected agent offers for its current
            model. Absent when it offers none, as after a switch to a model
            without levels.
        mcpUrl: { type: string }
        mcpToken:
          type: string
          description: Only present where the caller is entitled to see it.
        autoAllowedTools:
          type: array
          items: { type: string }
        allowAllCommands: { type: boolean }
        clearContextDefault:
          type: boolean
          description: |
            What a new task's clearContext starts as for this workspace.
        selfLearningLoopNote: { type: string }
        inputSendDelaySeconds:
          type: integer
          description: |
            Seconds a chat message waits in the thread before reaching the
            agent. 0 disables the delay. A new workspace starts at 5 unless
            the request sets it.
        workingDirectory: { type: string }
        slack: { $ref: '#/components/schemas/SlackConfig' }
        forkOfId:
          type: string
          description: The parent, when this workspace is a fork.
        forkOf:
          type: object
          description: The parent's name, on the list of workspaces.
          properties:
            id: { type: string }
            name: { type: string }
        forkCount:
          type: integer
          description: How many forks a parent has, on the list of workspaces.
        unfinishedTasks:
          type: integer
          description: |
            How many of a fork's tasks keep it from merging, on the list of
            workspaces.

    AgentModels:
      type: object
      description: |
        Live state read off the workspace's native ACP link rather than a
        stored column: the gateway's agent reports it over ACP v1, and it is
        reported only while the link that sent it is still connected.
      properties:
        configId:
          type: string
          description: |
            The agent session config option these were advertised under, which
            is what a selection would have to be written back to.
        currentModel: { type: string }
        canSet:
          type: boolean
          description: |
            Whether choosing one of these would do anything. False for an agent
            that reports what it is running but cannot be told to change it,
            which includes every gateway older than this feature — so a client
            shows a picker only when this is true.
        models:
          type: array
          items: { $ref: '#/components/schemas/AgentModel' }

    AgentModel:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        current: { type: boolean }
        group:
          type: string
          description: Optional grouping, e.g. the provider name.

    AgentEffort:
      type: object
      description: |
        Live state: the agent's session config option with category
        `thought_level`, reported only while the session that sent it is
        connected.
      properties:
        configId: { type: string }
        currentEffort: { type: string }
        canSet:
          type: boolean
          description: Whether choosing one of these would do anything.
        efforts:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: string }

    SlackConfig:
      type: object
      properties:
        enabled: { type: boolean }
        installed: { type: boolean }
        channelId: { type: string }
        channelName: { type: string }
        autoCreated: { type: boolean }
        clientId: { type: string }
        authUrl: { type: string }

    NotificationSettings:
      type: object
      properties:
        taskCreated: { type: boolean }
        taskStatusUpdated: { type: boolean }
        taskReceivedMessage: { type: boolean }
        workspaceArchived: { type: boolean }
        workspaceUnarchived: { type: boolean }
        channels:
          type: array
          items: { type: string }
          example: ["email"]

    Memory:
      type: object
      description: >
        One of a workspace's remembered notes. Written by agents, read-only over
        this API.
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        workspaceId: { type: string }
        name: { type: string, maxLength: 32 }
        sizeBytes:
          type: integer
          description: Size of the content in bytes. At most 16384.
        content:
          type: string
          description: >
            Present only when a single memory was requested by name; the list
            omits it.

    AccountSettings:
      type: object
      description: >
        Settings that hold in every workspace of an account, in groups. A field
        the account never saved has its default.
      properties:
        display:
          type: object
          description: How the app shows things.
          properties:
            timeFormat:
              type: string
              enum: [browser, 12h, 24h]
              default: browser
              description: The clock times are shown with; `browser` follows the browser's language.

    Preset:
      type: object
      description: A message the composer puts in place of `#name`.
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        workspaceId: { type: string }
        name: { type: string, maxLength: 64 }
        body: { type: string }

    PanoDoc:
      type: object
      description: >
        A markdown doc on the account's Pano. A blank workspace id is the
        person. `markdown`, `files`, `attachments` and `comments` come only
        with one doc.
      properties:
        id: { type: string }
        title: { type: string, maxLength: 200 }
        excerpt: { type: string, description: The markdown's opening, for the board. }
        markdown: { type: string, description: At most 256 KiB. }
        createdByWorkspaceId: { type: string }
        updatedByWorkspaceId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        ttlDays: { type: integer, description: Days the doc lives after its last save. }
        expiresAt: { type: string, format: date-time }
        color: { type: string, enum: [yellow, pink, green, blue, orange, purple, amber] }
        checklistDone: { type: integer, description: Checked items of the markdown's task list. }
        checklistTotal: { type: integer, description: Items of the markdown's task list, outside fenced code. }
        version: { type: integer, format: int64, description: Changes on every write; an update must send the one it read. }
        files:
          type: array
          description: Linked files, each linked from the markdown by its filename.
          items: { $ref: '#/components/schemas/PanoFile' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/PanoFile' }
        comments:
          type: array
          items: { $ref: '#/components/schemas/PanoComment' }
        tasks:
          type: array
          description: >
            The tasks linked to the doc, oldest link first, with their status
            now: a task the Pano chat named the doc for, the one task its agent
            was on when it wrote the doc, or a task one of its items is
            assigned to. Only with one doc.
          items: { $ref: '#/components/schemas/PanoDocTask' }

    PanoDocTask:
      type: object
      properties:
        taskId: { type: string }
        workspaceId: { type: string }
        status: { type: string }

    PanoFile:
      type: object
      properties:
        id: { type: string }
        filename: { type: string }
        mimeType: { type: string }
        size: { type: integer }
        url: { type: string, description: The file's public link, its only credential. }
        workspaceId: { type: string, description: Who added it; blank for the person. }
        createdAt: { type: string, format: date-time }

    PanoComment:
      type: object
      properties:
        id: { type: string }
        workspaceId: { type: string, description: Who wrote it; blank for the person. }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    PanoUpload:
      type: object
      required: [filename, data]
      properties:
        filename: { type: string }
        mimeType: { type: string }
        data: { type: string, format: byte, description: The content, base64; at most 2 MiB. }

    SavePanoDocRequest:
      type: object
      required: [title, markdown]
      properties:
        version: { type: integer, format: int64, description: The doc's version as read. Required to replace a doc, not to create one. }
        title: { type: string, maxLength: 200 }
        markdown: { type: string }
        ttlDays:
          type: integer
          minimum: 0
          description: Days the doc lives after this save, capped by the server's maximum. 0 keeps the doc's own, 30 for a new doc.
        color:
          type: string
          enum: ['', yellow, pink, green, blue, orange, purple, amber]
          description: Blank keeps the doc's own, yellow for a new doc.
        files:
          type: array
          description: Linked files; each must be linked from the markdown by its filename, or the save is refused.
          items: { $ref: '#/components/schemas/PanoUpload' }

    PanoDocResponse:
      type: object
      properties:
        doc: { $ref: '#/components/schemas/PanoDoc' }

    Skill:
      type: object
      description: >
        A playbook agents load for a kind of task: a `SKILL.md` and the files it
        references. It belongs to the account, its name unique there, and is
        turned on in workspaces one by one. Agents read it over MCP as
        `skill://<name>/<path>`.
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: string, maxLength: 64 }
        description:
          type: string
          maxLength: 1024
          description: From the SKILL.md frontmatter; what an agent matches on to load it.
        sourceType: { type: string, enum: [manual, github, gitlab] }
        sourceRepo: { type: string, description: '`owner/repo` (on GitLab `group/project`), for an imported skill.' }
        sourceRef: { type: string }
        sourceCommit: { type: string, description: The commit imported; empty when the host did not say. }
        sourcePath: { type: string, description: The skill's directory in the repository. }
        locallyModified:
          type: boolean
          description: An imported skill that has been changed since.
        fileCount: { type: integer, description: Files including SKILL.md. At most 256. }
        totalBytes: { type: integer }
        enabled:
          type: boolean
          description: The account-wide switch. Off, no agent sees the skill, whichever workspaces it is on in.
        workspaceIds:
          type: array
          items: { type: string }
          description: The workspaces the skill is on in, whose agents see it while `enabled` is true.
        workspaceEnabled:
          type: boolean
          description: Given only when the skill is read through a workspace, and then whether it is on there.
        files:
          type: array
          description: Present only when one skill was requested by name.
          items: { $ref: '#/components/schemas/SkillFile' }

    SkillFile:
      type: object
      properties:
        path: { type: string, maxLength: 255 }
        sizeBytes:
          type: integer
          description: At most 98304 for SKILL.md and 65536 for any other file.
        updatedAt: { type: string, format: date-time }
        content:
          type: string
          description: Present only when the file itself was requested.
        url:
          type: string
          format: uri
          readOnly: true
          description: |
            Public link to the file, readable with no session: the bucket when
            skills are kept in S3, `<base URL>/storage/skills/...` otherwise.
            A team skill's files have none.
        version:
          type: integer
          format: int64
          description: Given for a file others write too, such as a team skill's; a save that replaces it sends it back.

    TeamWorkspaceSkill:
      description: >
        A team workspace's skill. Read from a workspace, `on` is whether the
        workspace is opted into it, and `clash` whether the account's own skill
        of its name, on in that workspace, wins over it. Read from the team's
        page, `on` is true and `clash` false. Its files have no public `url`.
      allOf:
        - $ref: '#/components/schemas/Skill'
        - type: object
          properties:
            teamId: { type: string }
            teamWorkspaceId: { type: string }
            teamWorkspaceName: { type: string }
            on: { type: boolean }
            clash: { type: boolean }
    TeamWorkspaceRef:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        teamId: { type: string }
        teamName: { type: string }
    TeamWorkspaceSkillResponse:
      type: object
      properties:
        skill: { $ref: '#/components/schemas/TeamWorkspaceSkill' }
    TeamWorkspaceSkillFileResponse:
      type: object
      properties:
        skill: { $ref: '#/components/schemas/TeamWorkspaceSkill' }
        file: { $ref: '#/components/schemas/SkillFile' }

    SkillImportReport:
      type: object
      properties:
        imported:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              fileCount: { type: integer }
              totalBytes: { type: integer }
        skipped:
          type: array
          description: Skills and single files left out, each with the reason.
          items:
            type: object
            properties:
              name: { type: string }
              path: { type: string }
              reason: { type: string }
        candidates:
          type: array
          description: >
            Present only when the repository is too large to import whole and
            no skills were chosen: the skills to choose from, with the reason
            one cannot be imported when that is already known.
          items:
            type: object
            properties:
              name: { type: string }
              path: { type: string }
              sizeBytes: { type: integer, description: The size of its SKILL.md }
              reason: { type: string }
        sourceRepo: { type: string }
        sourceRef: { type: string }
        sourceCommit: { type: string }

    WorkspaceStats:
      type: object
      properties:
        summary:
          type: object
          properties:
            tasksCompleted: { type: integer, format: int64 }
            tasksScheduled: { type: integer, format: int64 }
            messages: { type: integer, format: int64 }
            manualApprovals: { type: integer, format: int64 }
            autoApprovals: { type: integer, format: int64 }
            denies: { type: integer, format: int64 }
        timeseries:
          type: object
          properties:
            tasksCompleted:
              type: array
              items: { $ref: '#/components/schemas/DailyStat' }
            messages:
              type: array
              items: { $ref: '#/components/schemas/DailyStat' }
        heatmap:
          type: object
          properties:
            granularity: { type: string, enum: [hour, day] }
            rangeStart: { type: integer, format: int64 }
            rangeEnd: { type: integer, format: int64 }
            tasksCompleted:
              type: array
              items: { $ref: '#/components/schemas/HeatmapStat' }
            messages:
              type: array
              items: { $ref: '#/components/schemas/HeatmapStat' }

    UserStats:
      allOf:
        - $ref: '#/components/schemas/WorkspaceStats'
        - type: object
          properties:
            workspaces:
              type: array
              description: >
                Per-workspace contribution to the totals above, busiest first.
                Workspaces with no completions and no messages in the window are
                omitted. A workspace deleted since the events were recorded
                still appears, with an empty name.
              items: { $ref: '#/components/schemas/WorkspaceStatsBreakdown' }

    TaskLatencyValue:
      type: object
      properties:
        seconds:
          type: integer
          format: int64
          nullable: true
          description: The aggregate, or null when no closed task had a value.
        count:
          type: integer
          format: int64
          description: How many closed tasks had a value.

    TaskLatencySummary:
      type: object
      properties:
        closed: { type: integer, format: int64, description: Tasks closed. }
        startToClose:
          allOf: [{ $ref: '#/components/schemas/TaskLatencyValue' }]
          description: From first going ongoing to closing. A task never started has none.
        worked: { $ref: '#/components/schemas/TaskLatencyValue' }
        blocked: { $ref: '#/components/schemas/TaskLatencyValue' }
        needsInput: { $ref: '#/components/schemas/TaskLatencyValue' }

    TaskLatencyPoint:
      allOf:
        - type: object
          properties:
            periodStart: { type: integer, format: int64, description: The bucket's start, unix seconds UTC. }
        - $ref: '#/components/schemas/TaskLatencySummary'

    TaskLatencyStats:
      type: object
      properties:
        granularity: { type: string, enum: [hour, day, month] }
        aggregate: { type: string, enum: [p50, min, max] }
        rangeStart: { type: integer, format: int64 }
        rangeEnd: { type: integer, format: int64 }
        points:
          type: array
          description: Every bucket of the period, oldest first, gaps included.
          items: { $ref: '#/components/schemas/TaskLatencyPoint' }
        summary: { $ref: '#/components/schemas/TaskLatencySummary' }

    WorkspaceStatsBreakdown:
      type: object
      properties:
        workspaceId: { type: string }
        name: { type: string }
        tasksCompleted: { type: integer, format: int64 }
        messages: { type: integer, format: int64 }

    DailyStat:
      type: object
      properties:
        date: { type: string }
        count: { type: integer, format: int64 }

    HeatmapStat:
      type: object
      properties:
        bucket: { type: string }
        count: { type: integer, format: int64 }

    TaskStatus:
      type: string
      enum: [notstarted, ongoing, completed, rejected, cron, blocked]

    Task:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        workspaceId: { type: string }
        createdBy: { type: string, enum: [human, agent] }
        assignee: { type: string, enum: [human, agent] }
        status: { $ref: '#/components/schemas/TaskStatus' }
        title: { type: string }
        body: { type: string }
        response: { type: string }
        replyText: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        metadata: {}
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        toolCalls:
          type: array
          description: The latest tool calls, oldest first; page in the rest with the tool-calls route.
          items: { $ref: '#/components/schemas/ToolCall' }
        toolCallCount:
          type: integer
          format: int64
          description: Every tool call the task has made, when it is read with its latest ones.
        cronSchedule:
          type: string
          description: |
            Cron expression. Granularity below hourly is rejected: the minute
            field must be a single fixed integer, not a wildcard, step, range
            or comma-list.
        parentId: { type: string }
        sortOrder: { type: number, format: double }
        allowAllCommands: { type: boolean }
        clearContext:
          type: boolean
          description: |
            Send /clear to the agent's terminal before handing it this task, so
            it starts on a clean context. Ignored when the workspace has no
            running Claude Code session on a connected machine.
        eventId:
          type: string
          description: Links the task to an event it should publish on completion.
        workflowId:
          type: string
          description: |
            Runs a whole named pipeline on completion instead of firing a
            single event. Setting one also sets `eventId` to that workflow's
            start event.
        completionTriggerType:
          type: integer
          description: Records which of `eventId` or `workflowId` the author actually picked.
        createdByWorkspaceId:
          type: string
          readOnly: true
          description: |
            The workspace that delegated this task through the supervisor's
            task tool. Absent for a task created any other way.
        agent:
          type: string
          readOnly: true
          description: |
            The agent that last changed the task's status, as it named
            itself: the one working on it, or the one that did. Only in a
            task list and on the live stream; absent when no agent has.
        timing:
          $ref: '#/components/schemas/TaskListTiming'
        agentNote:
          type: string
          readOnly: true
          description: |
            The workspace's self-learning note the agent was last handed
            the task with. Only on the single-task read; absent when no
            hand-off has been recorded.

    TaskEnvelope:
      type: object
      properties:
        task: { $ref: '#/components/schemas/Task' }

    TaskDetailEnvelope:
      type: object
      properties:
        task: { $ref: '#/components/schemas/Task' }
        stateTransitions:
          type: array
          description: Every change of the task's status, oldest first. History begins when it was first recorded, so an older task may have none.
          items: { $ref: '#/components/schemas/TaskStateTransition' }
        timing: { $ref: '#/components/schemas/TaskTiming' }
        panoDocs:
          type: array
          description: The Pano docs linked to the task, the first linked first; absent when it has none.
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }

    TaskStateTransition:
      type: object
      properties:
        fromState:
          type: string
          description: The status before the change; empty on the row written when the task was created.
        toState:
          type: string
          description: A task status, or needsinput while a question to the human is pending.
        agent:
          type: string
          description: The agent that made the change, as it names itself (e.g. claude-code). Absent when a person or the server made it.
        agentModel:
          type: string
          description: The model that agent was running, when it reported one.
        createdAt: { type: string, format: date-time }

    TaskListTiming:
      type: object
      readOnly: true
      description: |
        What a task's card shows. Only in a task list; absent for a task with
        no history.
      properties:
        workedSeconds:
          type: integer
          description: |
            Total time spent ongoing, up to the task's latest transition. While
            workingSince is set the task is still working, and the time since
            then adds to it.
        workingSince:
          type: string
          format: date-time
          description: The latest transition, while it is to ongoing; absent otherwise.
        statusSince:
          type: string
          format: date-time
          description: |
            When the task entered its current status. A question to the human
            (needsinput) is no change of status. Absent when the history does
            not end in the task's status.

    TaskTiming:
      type: object
      description: What the task's state transitions add up to. A state the task is still in counts up to the moment of the request.
      properties:
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: The first time the task went ongoing.
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: When the task became completed or rejected; null while it is not.
        startToCloseSeconds:
          type: integer
          nullable: true
          description: From startedAt to closedAt, when there are both.
        blockedSeconds:
          type: integer
          description: Total time spent blocked, waiting on the human.
        needsInputSeconds:
          type: integer
          description: Total time a question to the human (a permission request, an elicitation) was pending. Needing input is a state of the history only; it is never the task's status.
        workedSeconds:
          type: integer
          description: Total time spent ongoing.

    TaskList:
      type: object
      properties:
        tasks:
          type: array
          items: { $ref: '#/components/schemas/Task' }

    Message:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        taskId: { type: string }
        userId: { type: string }
        sender: { type: string }
        text: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        metadata: {}

    ToolCall:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        taskId: { type: string }
        toolName: { type: string }
        description: { type: string }
        inputPreview: { type: string }
        status:
          type: string
          enum: [auto_allowed, pending, allowed, denied, running, completed, failed, cancelled]
        output:
          type: string
          description: What a failed call said; absent otherwise.

    TaskPlan:
      type: object
      description: |
        The plan a task's agent is working to: at most one per task, replaced
        whole on every update.
      required: [id, content, version, createdAt, updatedAt]
      properties:
        id: { type: string, description: The task's id. }
        content: { type: string, description: The plan, as markdown. }
        version:
          type: integer
          format: int64
          description: How many times the agent has written the plan.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Attachment:
      type: object
      properties:
        id:
          type: string
          description: |
            Server-minted. Ignored on the way in — a caller-supplied ID is
            always overwritten — and the only field that identifies the file
            afterwards.
        filename: { type: string }
        mimeType: { type: string }
        data:
          type: string
          description: |
            Base64 on the way in only. Cleared before the metadata is stored,
            so it is absent from every response; use the attachment download
            route to get the bytes back.
        url:
          type: string
          format: uri
          readOnly: true
          description: |
            Public link to the file, readable with no session: the bucket when
            attachments are kept in S3, `<base URL>/storage/artifacts/...`
            otherwise. Set by the server; ignored on the way in. Absent for an
            attachment saved before links existed; the download route works
            either way.

    Hook:
      type: object
      properties:
        id: { type: string }
        builtIn: { type: boolean }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        icon:
          type: string
          description: A base64 data URI of an SVG or PNG image, or empty.
        sha256: { type: string }
        sizeBytes: { type: integer, format: int64 }
        abiVersion: { type: integer }
        inputs:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              label: { type: string }
              placeholder: { type: string, description: An example value the registration form shows in the empty field. }
              type: { type: string, enum: [string, number, boolean, array] }
              items: { type: string }
              secret: { type: boolean }
              required: { type: boolean }
        events:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              description: { type: string }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HookRegistration:
      type: object
      properties:
        id: { type: string }
        hookId: { type: string }
        hookName: { type: string }
        hookAvailable:
          type: boolean
          description: False while the hook is disabled, or no longer one the account may use.
        name: { type: string }
        enabled: { type: boolean }
        inputs:
          type: object
          additionalProperties: true
          description: The values of the inputs that are not secret.
        secretsSet:
          type: array
          items: { type: string }
          description: The secret inputs that have a value; a secret is never returned.
        routes:
          type: object
          additionalProperties: { type: string }
          description: The id of the event each of the hook's events fires.
        url: { type: string, description: 'The URL to give the outside service, without its `agentrq_hook_token`.' }
        urlWithToken: { type: string, description: Given only on create and on rotating the token. }
        allowAllCommandsEvents:
          type: array
          items: { type: string }
          description: Routed events with a trigger that allows every command.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HookDelivery:
      type: object
      properties:
        id: { type: string }
        registrationId: { type: string }
        receivedAt: { type: string, format: date-time }
        status: { type: string, enum: [queued, processing, routed, published, rejected, ignored, duplicate, failed] }
        attempts: { type: integer }
        eventNames:
          type: array
          items: { type: string }
          description: The hook's events the delivery routed.
        error: { type: string, description: 'Why it was rejected, ignored or failed, or why its last attempt failed.' }
        durationMs: { type: integer }
        replayable: { type: boolean, description: A failed delivery keeps its request and can be queued again. }

    HookRegistrationRequest:
      type: object
      properties:
        hookId: { type: string, description: Required on create; refused on update. }
        name: { type: string, minLength: 1, maxLength: 255 }
        enabled: { type: boolean }
        inputs: { type: object, additionalProperties: true }
        routes:
          type: object
          additionalProperties: { type: string }

    Event:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: string }
        payloadGuidelines:
          type: string
          description: Guidance shown to the agent on what to put in the payload.

    EventTrigger:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        eventId: { type: string }
        workspaceId: { type: string }
        title: { type: string }
        body: { type: string }
        assignee: { type: string, enum: [human, agent] }
        cronSchedule: { type: string }
        allowAllCommands: { type: boolean }
        emitEventId:
          type: string
          description: |
            Chains events: when the task this trigger spawned completes, it
            publishes this second event.

    EventTriggerInput:
      type: object
      properties:
        workspaceId: { type: string }
        title: { type: string }
        body: { type: string }
        assignee: { type: string, enum: [human, agent] }
        cronSchedule: { type: string }
        allowAllCommands: { type: boolean }
        emitEventId: { type: string }

    Workflow:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: string }
        description: { type: string }
        startEventId: { type: string }
        layout:
          description: |
            Opaque canvas state owned by the editor: stored and returned
            verbatim so the graph editor can change its own shape without a
            backend change.

    WorkflowStep:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        workflowId: { type: string }
        eventId: { type: string }
        workspaceId: { type: string }
        emitEventId: { type: string }
        title: { type: string }
        body: { type: string }
        assignee: { type: string, enum: [human, agent] }
        allowAllCommands: { type: boolean }

    Team:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer, format: int64, description: Counts the team's changes; every change sends the version it was made from. }
        memberCount: { type: integer }
        createdAt: { type: string, format: date-time }
    TeamNameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        version: { type: integer, format: int64, description: Required to rename. }
    TeamVersionRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, format: int64, minimum: 1 }
    ShareWorkspaceRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, format: int64, minimum: 1 }
        tasks: { type: boolean, default: true, description: Whether the team reads the workspace's tasks. }
        memory: { type: boolean, default: true, description: Whether the team's agents read the workspace's memory. }
        autoOptInSkills: { type: boolean, default: true, description: Opt the workspace into every skill of the team workspace it is shared into, later ones included, but those it was opted out of. Off, only the skills it is opted into now stay on. }
    TeamMember:
      type: object
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string }
        picture: { type: string }
        joinedAt: { type: string, format: date-time }
    TeamInvitation:
      type: object
      properties:
        id: { type: string }
        teamId: { type: string }
        teamName: { type: string }
        email: { type: string, description: 'The invited address, lowercased.' }
        invitedBy: { type: string }
        invitedByName: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    CreateTeamInvitationRequest:
      type: object
      required: [email, version]
      properties:
        email: { type: string }
        version: { type: integer, format: int64 }
    CreateTeamInvitationResponse:
      type: object
      properties:
        invitation: { $ref: '#/components/schemas/TeamInvitation' }
        emailSent: { type: boolean }
        link:
          type: string
          description: The invitation link, to share; the only time it is shown, and the only way in when emailSent is false. `<baseUrl>/invite#<token>`.
        version: { type: integer, format: int64, description: The team's version after the invitation. }
    TeamInvitationTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    TeamInvitationPreview:
      type: object
      properties:
        teamId: { type: string }
        teamName: { type: string }
        invitedByName: { type: string }
        email: { type: string, description: 'The invited address, masked: b***@acme.com.' }
        emailMatches: { type: boolean, description: Whether it is the signed-in account's email. }
        expiresAt: { type: string, format: date-time }
    PanoDocShare:
      type: object
      properties:
        teamId: { type: string }
        teamName: { type: string }
        docId: { type: string }
        createdAt: { type: string, format: date-time }
        version: { type: integer, format: int64, description: The team's version, on the share just made. }
    TeamPanoDoc:
      allOf:
        - $ref: '#/components/schemas/PanoDoc'
        - type: object
          properties:
