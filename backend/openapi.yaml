openapi: 3.0.3
info:
  title: AgentRQ API
  version: 1.0.0
  description: |
    OpenAPI specification for the AgentRQ backend HTTP API.

    ## Authentication

    Every route except those under `/auth` requires the `at` session cookie,
    set by one of the login flows. There is no bearer-token path: the frontend
    and the desktop app both address the API with same-origin relative URLs and
    let the cookie ride along.

    ## Conventions

    - All request and response JSON uses `camelCase`.
    - IDs are base62-encoded monoflakes rendered as strings, never numbers.
    - Most payloads are wrapped in a single named key — `{"task": {...}}`,
      `{"workspaces": [...]}` — rather than returned bare.

    ## Errors

    Two shapes are in use. Handlers that map a domain error return the
    structured envelope (`ErrorResponse`); several that validate inline return
    a flat `{"error": "message"}` (`SimpleError`). Each operation below names
    the one it returns.
servers:
  - url: /api/v1

tags:
  - name: Auth
  - name: Workspaces
  - name: Tasks
  - name: Attachments
  - name: Events
  - name: Workflows
  - name: Push
  - name: Telemetry
  - name: Browser
  - name: Streaming

paths:
  # ── Auth ────────────────────────────────────────────────────────────────────
  /auth/config:
    get:
      tags: [Auth]
      summary: Which login methods this deployment offers
      description: Public. Read before rendering a login screen.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rootLoginEnabled: { type: boolean }
                  githubLoginEnabled: { type: boolean }
                  basePath:
                    type: string
                    description: Path prefix the app is served under, if any.

  /auth/google/login:
    get:
      tags: [Auth]
      summary: Begin the Google OAuth flow
      security: []
      parameters:
        - name: redirect_url
          in: query
          required: false
          schema: { type: string }
          description: Where to land after login. Sanitized server-side.
      responses:
        '302': { description: Redirect to Google }

  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth callback
      security: []
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Session cookies set, then redirect.

  /auth/github/login:
    get:
      tags: [Auth]
      summary: Begin the GitHub OAuth flow
      security: []
      parameters:
        - name: redirect_url
          in: query
          required: false
          schema: { type: string }
      responses:
        '302': { description: Redirect to GitHub }
        '403':
          description: GitHub login is not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /auth/github/callback:
    get:
      tags: [Auth]
      summary: GitHub OAuth callback
      security: []
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Session cookies set, then redirect.

  /auth/root/login:
    post:
      tags: [Auth]
      summary: Log in with the root token
      description: |
        Only available when root login is enabled for the deployment; check
        `rootLoginEnabled` from `/auth/config` first.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
      responses:
        '200':
          description: Session cookies set
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        '400':
          description: Invalid payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '401':
          description: Invalid root token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '403':
          description: Root login disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange the refresh cookie for a fresh session
      description: |
        Public by design — the whole point is that the access token has already
        expired. Reads the `rt` cookie, which is scoped to this path.
      security: []
      responses:
        '200':
          description: New session cookies set
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        '401':
          description: Session expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /auth/user:
    get:
      tags: [Auth]
      summary: The authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401':
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Clear the session cookies
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  # ── Workspaces ──────────────────────────────────────────────────────────────
  /workspaces:
    get:
      tags: [Workspaces]
      summary: List workspaces
      parameters:
        - name: archived
          in: query
          required: false
          schema: { type: string, enum: ['true'] }
          description: Pass `true` to list archived workspaces instead of active ones.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaces:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
    post:
      tags: [Workspaces]
      summary: Create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace: { $ref: '#/components/schemas/Workspace' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace: { $ref: '#/components/schemas/Workspace' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      summary: Get a workspace
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace: { $ref: '#/components/schemas/Workspace' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Workspaces]
      summary: Update a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace: { $ref: '#/components/schemas/Workspace' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace: { $ref: '#/components/schemas/Workspace' }
        '422': { $ref: '#/components/responses/InvalidPayload' }
    delete:
      tags: [Workspaces]
      summary: Delete a workspace
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{id}/token:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      summary: Mint this workspace's MCP token
      description: |
        Returns a long-lived token (365 days) whose audience is this workspace
        plus `access`. This is the token that goes in `.mcp.json`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      summary: Archive a workspace
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: archived }

  /workspaces/{id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      summary: Restore an archived workspace
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: unarchived }

  /stats:
    get:
      tags: [Workspaces]
      summary: Activity statistics across every workspace the caller owns
      description: >
        The same aggregates as `/workspaces/{id}/stats`, summed over the whole
        account, plus a per-workspace breakdown of what drove them. The scope is
        the authenticated caller, so there is no id to pass.
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: ['1d', '7d', 'week', '30d', 'month', 'custom']
            default: '7d'
        - name: from
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Unix timestamp. Used only when `range=custom`.
        - name: to
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Unix timestamp. Used only when `range=custom`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserStats' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/stats:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      summary: Activity statistics for a workspace
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: ['1d', '7d', 'week', '30d', 'month', 'custom']
            default: '7d'
        - name: from
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Unix timestamp. Used only when `range=custom`.
        - name: to
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Unix timestamp. Used only when `range=custom`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceStats' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/memories:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      summary: What this workspace remembers
      description: >
        The workspace's memories, written by agents through the `saveMemory` MCP
        tool. `content` is omitted here — each memory runs to 16 KiB, so the list
        carries only names and sizes. Fetch one by name for its content.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  memories:
                    type: array
                    items: { $ref: '#/components/schemas/Memory' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/memories/{name}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: name
        in: path
        required: true
        schema: { type: string, maxLength: 32 }
        description: >
          The memory's name, as the agent saved it. `MEMORY.md` is the index
          agents read first.
    get:
      tags: [Workspaces]
      summary: One memory, in full
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  memory: { $ref: '#/components/schemas/Memory' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/skills:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      summary: Search the skills this workspace can use
      description: >
        Its own skills and those other workspaces of the same account shared
        into it, by name. With `q`, only skills whose name or description
        contains it, ignoring case. A shared-in skill carries
        `sharedFromWorkspaceId` and is read-only here. `files` is omitted.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 3, maxLength: 256 }
          description: Text to find in a skill's name or description. Leave it out to list every skill.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 100 }
          description: How many skills to return; larger values are capped at 100. Leave it out, or 0, to return every match.
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
          description: How many matches to skip.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  skills:
                    type: array
                    items: { $ref: '#/components/schemas/Skill' }
                  total:
                    type: integer
                    description: How many skills match in all, across every page.
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/skills/import:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      summary: Import skills from a public GitHub repository
      description: >
        Downloads the repository once and imports every skill in it. A plugin
        manifest, `.agentrq/plugin.json` or else `.muse-plugin/plugin.json`,
        says which directories are skills; without one, every directory with a
        `SKILL.md` is. A skill keeps its Markdown files, except a repository's
        own README, CLAUDE, AGENTS and similar meta files, and any other file
        its kept files reference, directly or in turn. Anything left out is
        listed in `skipped` with the reason, rather than failing the import.
        A repository too large to download whole imports nothing: its skills
        come back in `candidates`, and the import is asked again with the
        wanted ones in `skills`, which are then read file by file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  example: https://github.com/obra/superpowers
                  description: >
                    `https://github.com/<owner>/<repo>`, optionally ending in
                    `.git`, `/tree/<ref>` or `/tree/<ref>/<path>`.
                overwrite:
                  type: boolean
                  default: false
                  description: >
                    Replace a skill this workspace owns that has the same name.
                    A skill shared into the workspace is never replaced.
                skills:
                  type: array
                  maxItems: 256
                  items: { type: string }
                  example: [ship, careful]
                  description: >
                    Import only these skills, by their directory in the
                    repository as `candidates` gives it.
      responses:
        '200':
          description: What was imported, and what was left out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillImportReport' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Not a GitHub repository link, or one GitHub does not serve publicly
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: GitHub could not be reached, or would not list a repository too large to import whole
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /workspaces/{id}/skills/{name}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SkillName'
    get:
      tags: [Workspaces]
      summary: One skill, with its list of files
      description: The files are listed by path and size, without content.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  skill: { $ref: '#/components/schemas/Skill' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }
    delete:
      tags: [Workspaces]
      summary: Delete a skill, its files and its shares
      responses:
        '204': { description: Deleted }
        '403':
          description: The skill was shared into this workspace; only its owner can delete it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/skills/{name}/files/{path}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SkillName'
      - name: path
        in: path
        required: true
        schema: { type: string, maxLength: 255 }
        description: >
          The file's path from the skill's root, e.g. `SKILL.md` or
          `scripts/run.sh`. It is the rest of the URL, so it may contain `/`.
    get:
      tags: [Workspaces]
      summary: One file of a skill, with its content
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  skill: { $ref: '#/components/schemas/Skill' }
                  file: { $ref: '#/components/schemas/SkillFile' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/skills/{name}/shares:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SkillName'
    get:
      tags: [Workspaces]
      summary: The workspaces this skill is shared into
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  shares:
                    type: array
                    items: { $ref: '#/components/schemas/SkillShare' }
        '403':
          description: The skill was shared into this workspace; only its owner sees its shares
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/skills/{name}/shares/{targetWorkspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SkillName'
      - name: targetWorkspaceId
        in: path
        required: true
        schema: { type: string }
        description: Another workspace of the same account (base62).
    put:
      tags: [Workspaces]
      summary: Share a skill into another workspace
      description: >
        The skill stays one skill: the target reads it live, read-only, and
        sees every later change. Sharing it again is not an error.
      responses:
        '204': { description: Shared }
        '403':
          description: The skill was shared into this workspace; only its owner can share it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The target workspace already has a skill with this name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/InvalidPayload' }
    delete:
      tags: [Workspaces]
      summary: Stop sharing a skill into a workspace
      responses:
        '204': { description: No longer shared }
        '403':
          description: The skill was shared into this workspace; only its owner can unshare it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/slack:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    put:
      tags: [Workspaces]
      summary: Bind this workspace to a Slack channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId, channelName]
              properties:
                channelId: { type: string }
                channelName: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
        '400':
          description: Missing fields, or Slack is not enabled for this deployment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
    delete:
      tags: [Workspaces]
      summary: Unbind the Slack channel
      responses:
        '200': { description: OK }
        '400':
          description: Slack is not enabled for this deployment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /workspaces/{id}/agent/model:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      summary: Ask the connected agent to switch model
      description: |
        A request, not a state change. The agent is asked over its MCP channel
        and answers with a fresh models notification once it has actually
        switched, which is the only thing that knows whether it did — so a
        `202` means asked, never settled.

        Only the model is named. Which session to address and which config
        option to write it to are resolved from what the agent itself reported,
        and are deliberately not the caller's to choose.

        Available only where `agentModels.canSet` is true on the workspace. An
        agent that reports what it is running but cannot be told to change it —
        every gateway older than this feature, and every client that never
        reports models at all — refuses with a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId]
              properties:
                modelId:
                  type: string
                  description: One of the ids the agent advertised in `agentModels.models`.
      responses:
        '202':
          description: The agent was asked to switch
          content:
            application/json:
              schema:
                type: object
                properties:
                  requested: { type: string }
        '400':
          description: No model named, or a model the agent does not offer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '403':
          description: Not your workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '404':
          description: No agent connected for this workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '409':
          description: The connected agent does not support choosing a model, or could not be reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /workspaces/{id}/agent/concurrency:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      summary: Ask the connected gateway to change how many tasks it runs at once
      description: |
        A request, not a state change. The gateway is asked over its MCP channel
        and always answers with a fresh concurrency notification — accepted,
        clamped to its own range, or left untouched — which is the only thing
        that knows what actually happened, so a `202` means asked, never
        settled. Clients render the gateway's next report rather than the value
        they sent.

        A value outside the gateway's reported `min`/`max` is **not** refused
        here: the gateway clamps it and reports what it settled on. Only a value
        below 1 is refused, since that is a queue that never hands anything out.

        Raising takes effect at once and queued tasks start immediately, up to
        the new headroom. Lowering never interrupts a running task — they
        finish, and the queue stops handing out new ones until the active count
        falls below the new limit, so `active` may legitimately exceed
        `maxConcurrency` for a while afterwards.

        The limit lives in the gateway's memory. It survives an MCP reconnect
        but not a gateway restart, which falls back to the gateway's own
        `--max-concurrency` flag.

        Available only where `agentConcurrency.canSet` is true on the workspace.
        A gateway that reports its limit but cannot be told to change it — every
        gateway older than this feature — refuses with a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [maxConcurrency]
              properties:
                maxConcurrency:
                  type: integer
                  minimum: 1
                  description: |
                    How many tasks to run at once. Clamped by the gateway to the
                    range it reported in `agentConcurrency`.
      responses:
        '202':
          description: The gateway was asked to change its concurrency
          content:
            application/json:
              schema:
                type: object
                properties:
                  requested: { type: integer }
        '400':
          description: No limit named, or a limit below 1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '403':
          description: Not your workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '404':
          description: No agent connected for this workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '409':
          description: The connected gateway does not support changing its concurrency, or could not be reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  # ── Tasks ───────────────────────────────────────────────────────────────────
  /tasks:
    get:
      tags: [Tasks]
      summary: List tasks across every workspace
      description: Same filters as the per-workspace list, without the workspace bound.
      parameters:
        - $ref: '#/components/parameters/TaskStatusFilter'
        - $ref: '#/components/parameters/TaskCreatedByFilter'
        - $ref: '#/components/parameters/TaskFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }

  /tasks/stats:
    get:
      tags: [Tasks]
      summary: Counts that drive the global badges
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pendingTasks: { type: integer, format: int64 }
                  scheduledTasks: { type: integer, format: int64 }

  /workspaces/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Tasks]
      summary: List tasks in a workspace
      parameters:
        - $ref: '#/components/parameters/TaskStatusFilter'
        - $ref: '#/components/parameters/TaskCreatedByFilter'
        - $ref: '#/components/parameters/TaskFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }
    post:
      tags: [Tasks]
      summary: Create a task
      description: |
        A `cronSchedule` makes the task recurring and sets its status to `cron`.
        The minute field must be a single fixed integer: granularity below
        hourly is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task: { $ref: '#/components/schemas/Task' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/counts:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Tasks]
      summary: Task counts by category
      description: |
        Categories collapse several statuses: `ongoing` also counts `blocked`,
        `scheduled` counts `cron`, and `completed` counts `rejected`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer, format: int64 }
                properties:
                  notstarted: { type: integer, format: int64 }
                  ongoing: { type: integer, format: int64 }
                  scheduled: { type: integer, format: int64 }
                  completed: { type: integer, format: int64 }

  /workspaces/{id}/tasks/{taskID}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Get a task, with its messages and tool calls
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tasks]
      summary: Delete a task
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/respond:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Answer a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                response:
                  type: object
                  properties:
                    action:
                      type: string
                      enum: [allow, reject, allow_all, text]
                    text: { type: string }
                    attachments:
                      type: array
                      items: { $ref: '#/components/schemas/Attachment' }
                    metadata: {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/fork:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Fork a task's conversation into a new task
      description: |
        Copies the task, and its messages from the first up to and including
        `messageId`, into a new task in the same workspace. Attachments are
        copied under new IDs. The new task is `ongoing` and handed to the agent
        at once when the agent has room for it, and `notstarted` otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageId]
              properties:
                messageId: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/reply:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Post a message to the task thread
      description: |
        Attachment bytes travel as base64 in `data`, inside this JSON body. The
        server mints the attachment ID and clears `data` before storing the
        metadata, so any `id` sent by the caller is ignored. The whole request
        is subject to the server's 4 MB body limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reply:
                  type: object
                  properties:
                    text: { type: string }
                    attachments:
                      type: array
                      items: { $ref: '#/components/schemas/Attachment' }
                    metadata: {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/status:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [Tasks]
      summary: Change a task's status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: object
                  properties:
                    value: { $ref: '#/components/schemas/TaskStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/order:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [Tasks]
      summary: Reorder a task on the board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: object
                  properties:
                    value: { type: number, format: double }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/assignee:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [Tasks]
      summary: Reassign a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignee:
                  type: object
                  properties:
                    value: { type: string, enum: [human, agent] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/workspace:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [Tasks]
      summary: Move a task to another workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace:
                  type: object
                  properties:
                    value:
                      type: string
                      description: Destination workspace ID (base62).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/allow_all:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [Tasks]
      summary: Toggle blanket command approval for a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowAll:
                  type: object
                  properties:
                    value: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/scheduled:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    put:
      tags: [Tasks]
      summary: Change or clear a task's schedule
      description: |
        Only tasks in `cron` or `notstarted` can be edited. An empty
        `cronSchedule` clears the schedule and returns the task to
        `notstarted`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task: { $ref: '#/components/schemas/Task' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workspaces/{id}/tasks/{taskID}/permission:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Allow or deny a pending tool call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, behavior]
              properties:
                requestId: { type: string }
                behavior: { type: string, enum: [allow, deny] }
      responses:
        '200': { description: Verdict delivered }
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '403':
          description: Not your task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '404':
          description: No agent connected for this workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '410':
          description: |
            The request expired — usually the server restarted. The agent has
            to ask again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /workspaces/{id}/tasks/{taskID}/elicitation:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Answer an agent's elicitation request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, action]
              properties:
                requestId: { type: string }
                action: { type: string, enum: [accept, decline, cancel] }
                content:
                  type: object
                  additionalProperties: true
      responses:
        '200': { description: Answer delivered }
        '400':
          description: Missing `requestId`, or an action outside the enum
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '403':
          description: Not your task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '404':
          description: No agent connected for this workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '410':
          description: The agent stopped waiting, or the server restarted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /workspaces/{id}/tasks/{taskID}/stop:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Ask the agent to stop working on a task
      description: |
        A message to the agent, not a state change: the task's own status is
        untouched, and the agent decides what happens next.
      responses:
        '200':
          description: The agent acted on the request
          content:
            application/json:
              schema:
                type: object
                properties:
                  stopped: { type: boolean }
                  approvalsDenied: { type: integer }
        '400':
          description: Invalid task id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '403':
          description: Not your task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '404':
          description: No agent connected for this workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '409':
          description: The connected agent does not support being stopped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  # ── Attachments ─────────────────────────────────────────────────────────────
  /workspaces/{id}/tasks/{taskID}/attachments/{attachmentID}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
      - name: attachmentID
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Attachments]
      summary: Download an attachment
      description: |
        Streams the raw bytes — not base64 — with the stored MIME type and a
        `Content-Disposition` filename. Both task-level and message-level
        attachments are searched, and the task's owner is verified first, so an
        attachment on someone else's task is a 404 rather than a 403.
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  # ── Events ──────────────────────────────────────────────────────────────────
  /events:
    get:
      tags: [Events]
      summary: List events
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
    post:
      tags: [Events]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                payloadGuidelines: { type: string }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /events/{id}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      summary: Get an event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Events]
      summary: Update an event's payload guidelines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payloadGuidelines: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
    delete:
      tags: [Events]
      summary: Delete an event
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/triggers:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      summary: List the triggers subscribed to an event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventTriggers:
                    type: array
                    items: { $ref: '#/components/schemas/EventTrigger' }
    post:
      tags: [Events]
      summary: Subscribe a workspace to an event
      description: |
        `{{EVENT_PAYLOAD}}` and `{{EVENT_FAQ}}` are substituted into `body`
        when the trigger fires. The title is static text and is never
        substituted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventTriggerInput' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventTrigger: { $ref: '#/components/schemas/EventTrigger' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /events/{id}/triggers/{triggerID}:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - name: triggerID
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Events]
      summary: Update a trigger
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventTriggerInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventTrigger: { $ref: '#/components/schemas/EventTrigger' }
    delete:
      tags: [Events]
      summary: Delete a trigger
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      summary: Tasks spawned by this event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }

  # ── Workflows ───────────────────────────────────────────────────────────────
  /workflows:
    get:
      tags: [Workflows]
      summary: List workflows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflows:
                    type: array
                    items: { $ref: '#/components/schemas/Workflow' }
    post:
      tags: [Workflows]
      summary: Create a workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                startEventId: { type: string }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow: { $ref: '#/components/schemas/Workflow' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workflows/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      summary: Get a workflow
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow: { $ref: '#/components/schemas/Workflow' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Workflows]
      summary: Update a workflow
      description: |
        Every field is optional and an omitted one is left alone — saving a
        canvas layout must not blank the name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                startEventId: { type: string }
                layout:
                  description: Opaque canvas state, stored and returned verbatim.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow: { $ref: '#/components/schemas/Workflow' }
    delete:
      tags: [Workflows]
      summary: Delete a workflow and its steps
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /workflows/{id}/steps:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      summary: List a workflow's steps
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflowSteps:
                    type: array
                    items: { $ref: '#/components/schemas/WorkflowStep' }
    post:
      tags: [Workflows]
      summary: Add a step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId: { type: string }
                workspaceId: { type: string }
                emitEventId: { type: string }
                title: { type: string }
                body: { type: string }
                assignee: { type: string, enum: [human, agent] }
                allowAllCommands: { type: boolean }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflowStep: { $ref: '#/components/schemas/WorkflowStep' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /workflows/{id}/steps/{stepID}:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - name: stepID
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Workflows]
      summary: Delete a step
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /workflows/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      summary: Tasks spawned by this workflow
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }

  /workflows/{id}/text:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      summary: The workflow as editable text
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
    put:
      tags: [Workflows]
      summary: Replace the workflow from text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow: { $ref: '#/components/schemas/Workflow' }
                  stepCount: { type: integer }
        '400':
          description: |
            Parse or validation failure. Carries the offending source line so
            the editor can mark the row rather than showing a bare message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message: { type: string }
                      line: { type: integer }

  # ── Push notifications ──────────────────────────────────────────────────────
  /push/vapid-public-key:
    get:
      tags: [Push]
      summary: The VAPID public key for Web Push
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicKey: { type: string }

  /push/subscription:
    get:
      tags: [Push]
      summary: Whether an endpoint is subscribed for a workspace
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema: { type: string }
        - name: endpoint
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscribed: { type: boolean }
        '403':
          description: Not your workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '422': { $ref: '#/components/responses/InvalidPayload' }
    delete:
      tags: [Push]
      summary: Remove every subscription for a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceId: { type: string }
      responses:
        '204': { description: Deleted }
        '403':
          description: Not your workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  /push/subscribe:
    post:
      tags: [Push]
      summary: Subscribe a browser endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys, workspaceId]
              properties:
                endpoint: { type: string }
                keys:
                  type: object
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
                workspaceId: { type: string }
                types:
                  type: array
                  items: { type: string }
                  description: Omit or leave empty for every notification type.
      responses:
        '201':
          description: Subscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: subscribed }
        '403':
          description: Not your workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '422': { $ref: '#/components/responses/InvalidPayload' }
    delete:
      tags: [Push]
      summary: Unsubscribe one endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint: { type: string }
      responses:
        '204': { description: Unsubscribed }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  # ── Telemetry ───────────────────────────────────────────────────────────────
  /telemetry:
    post:
      tags: [Telemetry]
      summary: Record one client-side action
      description: |
        `action` comes from a fixed allowlist rather than being free text, and
        there is deliberately no field for a count, a timestamp or a payload:
        the server decides when the event happened and what one call is worth,
        so a caller cannot backdate an event or claim a thousand at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, workspaceId]
              properties:
                action: { type: string }
                workspaceId: { type: string }
      responses:
        '204': { description: Recorded }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '422': { $ref: '#/components/responses/InvalidPayload' }

  # ── Browser ─────────────────────────────────────────────────────────────────
  /browser/ticket:
    post:
      tags: [Browser]
      summary: Mint a ticket for the browser socket
      description: |
        For the AgentRQ Chrome extension, whose origin never receives the `at`
        cookie. The ticket is good for one connect, within `expiresIn` seconds.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expiresIn]
                properties:
                  ticket: { type: string }
                  expiresIn: { type: integer, description: Seconds. }

  /browser/connect:
    get:
      tags: [Browser]
      summary: The Chrome extension's WebSocket
      description: |
        Carries the shared sites' WebMCP tools and the calls to them, as JSON
        frames. Authenticated by the ticket, not the cookie. Served by the
        standard-library mux, because a WebSocket upgrade must hijack the
        connection.
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema: { type: string }
          description: From `POST /browser/ticket`.
        - name: browser
          in: query
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9-]{1,64}$' }
          description: The extension's own id for this Chrome profile.
      responses:
        '101': { description: Switching protocols }
        '400': { description: Bad browser id, or not a WebSocket upgrade }
        '401': { description: Missing or invalid ticket }

  # ── Streaming ───────────────────────────────────────────────────────────────
  /events/stream:
    get:
      tags: [Streaming]
      summary: Server-sent events across every workspace
      description: |
        Long-lived `text/event-stream`. Authenticated by the `at` cookie like
        every other route.

        Event types: `task.created`, `task.updated`, `task.deleted`,
        `status.updated`, `reply.received`, `respond.ack`, `agent.connected`.

        Served by the standard-library mux rather than by Fiber, because Fiber's
        response buffering is unsuited to a stream that never ends.
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { description: Unauthenticated }

  /workspaces/{id}/events:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Streaming]
      summary: Server-sent events for one workspace
      description: |
        The same stream as `/events/stream`, narrowed to one workspace. Also
        served by the standard-library mux, which takes exact path matches
        ahead of Fiber.
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { description: Unauthenticated }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: at
      description: Access token cookie, set by any of the `/auth` login flows.

  parameters:
    WorkspaceId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Workspace ID (base62).
    TaskId:
      name: taskID
      in: path
      required: true
      schema: { type: string }
      description: Task ID (base62).
    EventId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Event ID (base62).
    WorkflowId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Workflow ID (base62).
    TaskStatusFilter:
      name: status
      in: query
      required: false
      schema: { type: string }
      description: Comma-separated list of statuses, e.g. `ongoing,blocked`.
    TaskCreatedByFilter:
      name: created_by
      in: query
      required: false
      schema: { type: string, enum: [human, agent] }
      description: |
        Note the snake_case spelling — this query parameter predates the
        camelCase convention that governs JSON bodies.
    TaskFilter:
      name: filter
      in: query
      required: false
      schema: { type: string, enum: [pending_approval] }
      description: Named filter. `pending_approval` selects tasks whose most recent message is a permission request.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 10, maximum: 50 }
      description: Clamped server-side to 50; a value of 0 or less falls back to 10.
    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, default: 0 }
    SkillName:
      name: name
      in: path
      required: true
      schema: { type: string, maxLength: 64, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
      description: The skill's name, unique among the skills a workspace can use.

  responses:
    InvalidPayload:
      description: Invalid request payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AccessDenied:
      description: Access denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      description: The structured envelope returned by handlers that map a domain error.
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            code: { type: integer }

    SimpleError:
      type: object
      description: |
        The flat shape returned by handlers that validate inline. Both forms
        are live; each operation above names which one it returns.
      properties:
        error: { type: string }

    AuthenticatedUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        picture: { type: string }

    Workspace:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: string }
        description:
          type: string
          description: The workspace's mission, shown to the agent.
        archivedAt: { type: string, format: date-time, nullable: true }
        icon: { type: string }
        notificationSettings: { $ref: '#/components/schemas/NotificationSettings' }
        agentConnected:
          type: boolean
          description: Whether an agent currently holds an MCP session.
        agentSupportsStop: { type: boolean }
        agentModels:
          allOf: [{ $ref: '#/components/schemas/AgentModels' }]
          description: |
            What the connected agent can switch between. Absent when no agent is
            connected, or when the connected one has not reported any, so its
            presence means a choice exists.
        agentConcurrency:
          allOf: [{ $ref: '#/components/schemas/AgentConcurrency' }]
          description: |
            How many tasks the connected gateway runs at once. Absent when no
            gateway is connected, or when the connected one has not reported a
            limit, so its presence means there is a number to show.
        mcpUrl: { type: string }
        mcpToken:
          type: string
          description: Only present where the caller is entitled to see it.
        autoAllowedTools:
          type: array
          items: { type: string }
        allowAllCommands: { type: boolean }
        clearContextDefault:
          type: boolean
          description: |
            What a new task's clearContext starts as for this workspace.
        selfLearningLoopNote: { type: string }
        inputSendDelaySeconds:
          type: integer
          description: |
            Seconds a chat message waits in the thread before reaching the
            agent. 0 disables the delay.
        workingDirectory: { type: string }
        slack: { $ref: '#/components/schemas/SlackConfig' }

    AgentModels:
      type: object
      description: |
        Live state read off the workspace's MCP session rather than a stored
        column: it arrives as a `notifications/claude/channel/models`
        notification from the gateway and is reported only while the session
        that sent it is still connected.
      properties:
        configId:
          type: string
          description: |
            The agent session config option these were advertised under, which
            is what a selection would have to be written back to.
        currentModel: { type: string }
        canSet:
          type: boolean
          description: |
            Whether choosing one of these would do anything. False for an agent
            that reports what it is running but cannot be told to change it,
            which includes every gateway older than this feature — so a client
            shows a picker only when this is true.
        models:
          type: array
          items: { $ref: '#/components/schemas/AgentModel' }

    AgentModel:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        current: { type: boolean }
        group:
          type: string
          description: Optional grouping, e.g. the provider name.

    AgentConcurrency:
      type: object
      description: |
        Live state read off the workspace's MCP session rather than a stored
        column: it arrives as a `notifications/claude/channel/concurrency`
        notification from the gateway and is reported only while the session
        that sent it is still connected. The limit itself lives in the
        gateway's memory and does not survive its restart.
      properties:
        maxConcurrency:
          type: integer
          description: How many tasks the gateway will run at once.
        active:
          type: integer
          description: |
            How many it is running. May legitimately exceed `maxConcurrency`
            for a while after a lower, since running tasks are allowed to
            finish — worth showing rather than treating as an error state.
        queued:
          type: integer
          description: How many are waiting for a slot.
        min:
          type: integer
          description: The lowest limit the gateway will accept.
        max:
          type: integer
          description: |
            The highest limit the gateway will accept, or 0 when it named no
            ceiling of its own. Read this rather than assuming one — the
            gateway owns its ceiling.
        canSet:
          type: boolean
          description: |
            Whether changing the limit would do anything. False for a gateway
            that reports what it is running but cannot be told to change it,
            which includes every gateway older than this feature — so a client
            shows a control only when this is true, and a read-only number
            otherwise.

    SlackConfig:
      type: object
      properties:
        enabled: { type: boolean }
        installed: { type: boolean }
        channelId: { type: string }
        channelName: { type: string }
        autoCreated: { type: boolean }
        clientId: { type: string }
        authUrl: { type: string }

    NotificationSettings:
      type: object
      properties:
        taskCreated: { type: boolean }
        taskStatusUpdated: { type: boolean }
        taskReceivedMessage: { type: boolean }
        workspaceArchived: { type: boolean }
        workspaceUnarchived: { type: boolean }
        channels:
          type: array
          items: { type: string }
          example: ["email"]

    Memory:
      type: object
      description: >
        One of a workspace's remembered notes. Written by agents, read-only over
        this API.
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        workspaceId: { type: string }
        name: { type: string, maxLength: 32 }
        sizeBytes:
          type: integer
          description: Size of the content in bytes. At most 16384.
        content:
          type: string
          description: >
            Present only when a single memory was requested by name; the list
            omits it.

    Skill:
      type: object
      description: >
        A playbook agents load for a kind of task: a `SKILL.md` and the files it
        references. Agents read it over MCP as `skill://<name>/<path>`.
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        workspaceId:
          type: string
          description: The workspace that owns the skill.
        name: { type: string, maxLength: 64 }
        description:
          type: string
          maxLength: 1024
          description: From the SKILL.md frontmatter; what an agent matches on to load it.
        sourceType: { type: string, enum: [manual, github] }
        sourceRepo: { type: string, description: '`owner/repo`, for an imported skill.' }
        sourceRef: { type: string }
        sourceCommit: { type: string, description: The commit imported; empty when GitHub did not say. }
        sourcePath: { type: string, description: The skill's directory in the repository. }
        locallyModified:
          type: boolean
          description: An imported skill that has been changed since.
        fileCount: { type: integer, description: Files including SKILL.md. At most 64. }
        totalBytes: { type: integer }
        sharedFromWorkspaceId:
          type: string
          description: Set when another workspace shared the skill in; it is read-only here.
        files:
          type: array
          description: Present only when one skill was requested by name.
          items: { $ref: '#/components/schemas/SkillFile' }

    SkillFile:
      type: object
      properties:
        path: { type: string, maxLength: 255 }
        sizeBytes:
          type: integer
          description: At most 98304 for SKILL.md and 65536 for any other file.
        updatedAt: { type: string, format: date-time }
        content:
          type: string
          description: Present only when the file itself was requested.

    SkillShare:
      type: object
      properties:
        targetWorkspaceId: { type: string }
        createdAt: { type: string, format: date-time }

    SkillImportReport:
      type: object
      properties:
        imported:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              fileCount: { type: integer }
              totalBytes: { type: integer }
        skipped:
          type: array
          description: Skills and single files left out, each with the reason.
          items:
            type: object
            properties:
              name: { type: string }
              path: { type: string }
              reason: { type: string }
        candidates:
          type: array
          description: >
            Present only when the repository is too large to import whole and
            no skills were chosen: the skills to choose from, with the reason
            one cannot be imported when that is already known.
          items:
            type: object
            properties:
              name: { type: string }
              path: { type: string }
              sizeBytes: { type: integer, description: The size of its SKILL.md }
              reason: { type: string }
        sourceRepo: { type: string }
        sourceRef: { type: string }
        sourceCommit: { type: string }

    WorkspaceStats:
      type: object
      properties:
        summary:
          type: object
          properties:
            tasksCompleted: { type: integer, format: int64 }
            tasksScheduled: { type: integer, format: int64 }
            messages: { type: integer, format: int64 }
            manualApprovals: { type: integer, format: int64 }
            autoApprovals: { type: integer, format: int64 }
            denies: { type: integer, format: int64 }
        timeseries:
          type: object
          properties:
            tasksCompleted:
              type: array
              items: { $ref: '#/components/schemas/DailyStat' }
            messages:
              type: array
              items: { $ref: '#/components/schemas/DailyStat' }
        heatmap:
          type: object
          properties:
            granularity: { type: string, enum: [hour, day] }
            rangeStart: { type: integer, format: int64 }
            rangeEnd: { type: integer, format: int64 }
            tasksCompleted:
              type: array
              items: { $ref: '#/components/schemas/HeatmapStat' }
            messages:
              type: array
              items: { $ref: '#/components/schemas/HeatmapStat' }

    UserStats:
      allOf:
        - $ref: '#/components/schemas/WorkspaceStats'
        - type: object
          properties:
            workspaces:
              type: array
              description: >
                Per-workspace contribution to the totals above, busiest first.
                Workspaces with no completions and no messages in the window are
                omitted. A workspace deleted since the events were recorded
                still appears, with an empty name.
              items: { $ref: '#/components/schemas/WorkspaceStatsBreakdown' }

    WorkspaceStatsBreakdown:
      type: object
      properties:
        workspaceId: { type: string }
        name: { type: string }
        tasksCompleted: { type: integer, format: int64 }
        messages: { type: integer, format: int64 }

    DailyStat:
      type: object
      properties:
        date: { type: string }
        count: { type: integer, format: int64 }

    HeatmapStat:
      type: object
      properties:
        bucket: { type: string }
        count: { type: integer, format: int64 }

    TaskStatus:
      type: string
      enum: [notstarted, ongoing, completed, rejected, cron, blocked]

    Task:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        workspaceId: { type: string }
        createdBy: { type: string, enum: [human, agent] }
        assignee: { type: string, enum: [human, agent] }
        status: { $ref: '#/components/schemas/TaskStatus' }
        title: { type: string }
        body: { type: string }
        response: { type: string }
        replyText: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        metadata: {}
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        toolCalls:
          type: array
          items: { $ref: '#/components/schemas/ToolCall' }
        cronSchedule:
          type: string
          description: |
            Cron expression. Granularity below hourly is rejected: the minute
            field must be a single fixed integer, not a wildcard, step, range
            or comma-list.
        parentId: { type: string }
        sortOrder: { type: number, format: double }
        allowAllCommands: { type: boolean }
        clearContext:
          type: boolean
          description: |
            Send /clear to the agent's terminal before handing it this task, so
            it starts on a clean context. Ignored when the workspace has no
            running Claude Code session on a connected machine.
        eventId:
          type: string
          description: Links the task to an event it should publish on completion.
        workflowId:
          type: string
          description: |
            Runs a whole named pipeline on completion instead of firing a
            single event. Setting one also sets `eventId` to that workflow's
            start event.
        completionTriggerType:
          type: integer
          description: Records which of `eventId` or `workflowId` the author actually picked.

    TaskEnvelope:
      type: object
      properties:
        task: { $ref: '#/components/schemas/Task' }

    TaskList:
      type: object
      properties:
        tasks:
          type: array
          items: { $ref: '#/components/schemas/Task' }

    Message:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        taskId: { type: string }
        userId: { type: string }
        sender: { type: string }
        text: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        metadata: {}

    ToolCall:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        taskId: { type: string }
        toolName: { type: string }
        description: { type: string }
        inputPreview: { type: string }
        status:
          type: string
          enum: [auto_allowed, pending, allowed, denied]

    Attachment:
      type: object
      properties:
        id:
          type: string
          description: |
            Server-minted. Ignored on the way in — a caller-supplied ID is
            always overwritten — and the only field that identifies the file
            afterwards.
        filename: { type: string }
        mimeType: { type: string }
        data:
          type: string
          description: |
            Base64 on the way in only. Cleared before the metadata is stored,
            so it is absent from every response; use the attachment download
            route to get the bytes back.
        url:
          type: string
          format: uri
          readOnly: true
          description: |
            Public link to the file, present only when attachments are kept in
            S3 (`AGENTRQ_ATTACHMENTS_STORAGE=s3`). Set by the server; ignored
            on the way in. The download route works either way.

    Event:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: string }
        payloadGuidelines:
          type: string
          description: Guidance shown to the agent on what to put in the payload.

    EventTrigger:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        eventId: { type: string }
        workspaceId: { type: string }
        title: { type: string }
        body: { type: string }
        assignee: { type: string, enum: [human, agent] }
        cronSchedule: { type: string }
        allowAllCommands: { type: boolean }
        emitEventId:
          type: string
          description: |
            Chains events: when the task this trigger spawned completes, it
            publishes this second event.

    EventTriggerInput:
      type: object
      properties:
        workspaceId: { type: string }
        title: { type: string }
        body: { type: string }
        assignee: { type: string, enum: [human, agent] }
        cronSchedule: { type: string }
        allowAllCommands: { type: boolean }
        emitEventId: { type: string }

    Workflow:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: string }
        description: { type: string }
        startEventId: { type: string }
        layout:
          description: |
            Opaque canvas state owned by the editor: stored and returned
            verbatim so the graph editor can change its own shape without a
            backend change.

    WorkflowStep:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        workflowId: { type: string }
        eventId: { type: string }
        workspaceId: { type: string }
        emitEventId: { type: string }
        title: { type: string }
        body: { type: string }
        assignee: { type: string, enum: [human, agent] }
        allowAllCommands: { type: boolean }

security:
  - sessionCookie: []
