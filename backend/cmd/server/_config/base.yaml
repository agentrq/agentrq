app:
  port: ${PORT:3000}
  baseUrl: ${AGENTRQ_BASE_URL:http://localhost:3000}
  domain: ${AGENTRQ_DOMAIN:localhost}
  basePath: ${AGENTRQ_BASE_PATH:}
  cookieSecure: ${AGENTRQ_COOKIE_SECURE:}
  proxyDomain: ${AGENTRQ_PROXY_DOMAIN:}
  # On shutdown, how long /readyz fails while requests are still served.
  drainDelay: ${AGENTRQ_APP_DRAIN_DELAY:0s}

ssl:
  enabled: ${AGENTRQ_SSL_ENABLED:false}
  cacheDir: ${AGENTRQ_SSL_CACHE_DIR:/_certs}
  letsencryptEmail: ${AGENTRQ_SSL_LETSENCRYPT_EMAIL:}
  cloudflareApiToken: ${AGENTRQ_SSL_CLOUDFLARE_API_TOKEN:}
  # Optional private bucket certificates are shared through, apart from the
  # s3 section below. A certificate missing on disk is looked for here before
  # one is obtained, and a new one is saved here.
  s3:
    enabled: ${AGENTRQ_SSL_S3_ENABLED:false}
    endpoint: "${AGENTRQ_SSL_S3_ENDPOINT:}"
    accessKey: "${AGENTRQ_SSL_S3_ACCESS_KEY:}"
    secretAccessKey: "${AGENTRQ_SSL_S3_SECRET_ACCESS_KEY:}"
    region: "${AGENTRQ_SSL_S3_REGION:us-east-1}"
    bucket: "${AGENTRQ_SSL_S3_BUCKET:}"

# SQLite runs on a single host only; more than one instance needs postgres.
sqlite:
  enabled: ${AGENTRQ_SQLITE_ENABLED:true}
  dsn: ${AGENTRQ_SQLITE_DSN:./_storage/agentrq.db}
  maxIdleConns: 10
  maxOpenConns: 100
  maxConnLifetime: 1h

postgres:
  enabled: ${AGENTRQ_POSTGRES_ENABLED:false}
  dsn: "host=${AGENTRQ_POSTGRES_HOST:localhost} user=${AGENTRQ_POSTGRES_USER:postgres} password=${AGENTRQ_POSTGRES_PASSWORD:postgres} dbname=${AGENTRQ_POSTGRES_DBNAME:agentrq} port=${AGENTRQ_POSTGRES_PORT:5432} sslmode=disable TimeZone=UTC"
  maxIdleConns: 10
  maxOpenConns: 100
  maxConnLifetime: 1h

auth:
  # Both read one env var until each is set on /admin/config.
  apiJwtSecret: ${AGENTRQ_AUTH_JWT_SECRET}
  mcpJwtSecret: ${AGENTRQ_AUTH_JWT_SECRET}
  rootAccessToken: ${AGENTRQ_AUTH_ROOT_ACCESS_TOKEN:agentrq}
  rootLoginEnabled: ${AGENTRQ_AUTH_ROOT_LOGIN_ENABLED:false}
  workspaceTokenKey: ${AGENTRQ_AUTH_WORKSPACE_TOKEN_KEY:agentrq-token-key-change-me-32by}
  # Other hosts a sign-in may return to through ?redirect_url=, comma separated
  # (or a yaml list), e.g. app.example.com,docs.example.com
  allowedRedirectDomains: ${AGENTRQ_AUTH_ALLOWED_REDIRECT_DOMAINS:}
  google:
    clientId: ${AGENTRQ_ACCOUNTS_OAUTH2_CLI_GOOGLE_CLIENT_ID}
    clientSecret: ${AGENTRQ_ACCOUNTS_OAUTH2_CLI_GOOGLE_CLIENT_SECRET}
  github:
    clientId: ${AGENTRQ_ACCOUNTS_OAUTH2_CLI_GITHUB_CLIENT_ID}
    clientSecret: ${AGENTRQ_ACCOUNTS_OAUTH2_CLI_GITHUB_CLIENT_SECRET}
  # Sign-in providers besides Google and GitHub, added on /admin/config: any
  # OAuth2 server whose userinfo endpoint answers with the OpenID Connect claims.
  oauth2Providers: []

smtp:
  enabled: ${AGENTRQ_SMTP_ENABLED:true}
  host: ${AGENTRQ_SMTP_HOST:}
  port: ${AGENTRQ_SMTP_PORT:587}
  username: ${AGENTRQ_SMTP_USERNAME:}
  password: ${AGENTRQ_SMTP_PASSWORD:}
  from: ${AGENTRQ_SMTP_FROM:AgentRQ <no-reply@agentrq.com>}

pubsub:
  maxDurationForSubscriberToReceive: 5s

slack:
  enabled: ${AGENTRQ_SLACK_ENABLED:false}
  signingSecret: "${AGENTRQ_SLACK_SIGNING_SECRET:}"
  appId: "${AGENTRQ_SLACK_APP_ID:}"
  clientId: "${AGENTRQ_SLACK_CLIENT_ID:}"
  clientSecret: "${AGENTRQ_SLACK_CLIENT_SECRET:}"

# A GitHub App of the server's own, so skills can be imported from private
# repositories: each account installs it on the repositories it picks. On the
# app's settings page on GitHub set the callback URL to <baseUrl>/github/callback,
# turn on "Request user authorization (OAuth) during installation", and give
# it read-only Contents permission. slug is the name in github.com/apps/<slug>;
# privateKey is the app's whole PEM key, pasted as it is.
githubApp:
  enabled: ${AGENTRQ_GITHUB_APP_ENABLED:false}
  appId: "${AGENTRQ_GITHUB_APP_ID:}"
  slug: "${AGENTRQ_GITHUB_APP_SLUG:}"
  clientId: "${AGENTRQ_GITHUB_APP_CLIENT_ID:}"
  clientSecret: "${AGENTRQ_GITHUB_APP_CLIENT_SECRET:}"
  privateKey: "${AGENTRQ_GITHUB_APP_PRIVATE_KEY:}"

gitlabApp:
  enabled: ${AGENTRQ_GITLAB_APP_ENABLED:false}
  host: "${AGENTRQ_GITLAB_APP_HOST:gitlab.com}"
  clientId: "${AGENTRQ_GITLAB_APP_CLIENT_ID:}"
  clientSecret: "${AGENTRQ_GITLAB_APP_CLIENT_SECRET:}"

webPush:
  vapidPublicKey: ${AGENTRQ_WEBPUSH_VAPID_PUBLIC_KEY:}
  vapidPrivateKey: ${AGENTRQ_WEBPUSH_VAPID_PRIVATE_KEY:}
  subscriber: ${AGENTRQ_WEBPUSH_SUBSCRIBER:mailto:hi@example.com}

# Per client address: past maxRequestsPerSecond in one second, every request is
# refused for blockDuration. A first visit to the web app, with its service
# worker's precache, is about 160 requests in under a second.
ddos:
  enabled: ${AGENTRQ_DDOS_ENABLED:true}
  maxRequestsPerSecond: ${AGENTRQ_DDOS_MAX_REQ_PER_SEC:200}
  blockDuration: ${AGENTRQ_DDOS_BLOCK_DURATION:1m}

# Per client address, and per signed-in user, in each window. Agents' MCP calls
# from one machine share its address.
ratelimit:
  enabled: ${AGENTRQ_RATELIMIT_ENABLED:true}
  maxPerIP: ${AGENTRQ_RATELIMIT_MAX_PER_IP:1200}
  maxPerUser: ${AGENTRQ_RATELIMIT_MAX_PER_USER:600}
  window: ${AGENTRQ_RATELIMIT_WINDOW:60s}

# Who the throttles count. The header is believed only from these proxies
# (comma-separated CIDRs or addresses); empty believes no header, and every
# client is the address that connected. The header is X-Real-IP,
# X-Forwarded-For (read from the right) or CF-Connecting-IP.
network:
  trustedProxies: "${AGENTRQ_TRUSTED_PROXIES:}"
  clientIpHeader: ${AGENTRQ_CLIENT_IP_HEADER:X-Real-IP}

storage:
  # Attachments, and skills under skills/ when they are local. Must be writable.
  dir: ${AGENTRQ_STORAGE_DIR:./_storage}
  attachmentRetentionPeriod: ${AGENTRQ_APP_ATTACHMENT_RETENTION:7d}

# Most bytes one workspace memory may hold: 16384 (16 KiB) by default, 131072 at most.
memory:
  maxFileSize: ${AGENTRQ_MEMORY_MAX_FILE_SIZE:16384}

# Where skill files and attachments (artifacts) are kept: "local" (<storage dir>/skills
# and <storage dir>/artifacts) or "s3", which uses the s3 block below. Either way each
# file has a public link: <baseUrl>/storage/... when local, the bucket when s3, which
# must then allow public reads under skills/ and artifacts/.
skills:
  storage: ${AGENTRQ_SKILLS_STORAGE:local}
  maxFileSize: ${AGENTRQ_SKILLS_MAX_FILE_SIZE:98304}
  maxFiles: ${AGENTRQ_SKILLS_MAX_FILES:256}

artifacts:
  storage: ${AGENTRQ_ARTIFACTS_STORAGE:local}

# Where Pano docs and their files are kept: "local" (<storage dir>/pano) or "s3", which
# must then allow public reads under pano/. A doc lives 30 days from its last save
# unless its writer asks otherwise, and maxTtlDays at most.
pano:
  storage: ${AGENTRQ_PANO_STORAGE:local}
  maxTtlDays: ${AGENTRQ_PANO_MAX_TTL_DAYS:365}

# Hooks turn requests from outside services (a CI, GitHub) into events. Built-in
# hooks are registered by the root user; allowUserHooks lets every account upload
# its own. A delivery is kept deliveryRetention from its arrival (7d, 36h; 1d at
# least), and one event payload a hook writes holds at most maxPayloadSize bytes
# (1024 to 1048576). Modules are kept in <storage dir>/hooks, or in S3 under hooks/
# with storage: s3, and are never public.
hooks:
  storage: ${AGENTRQ_HOOKS_STORAGE:local}
  allowUserHooks: ${AGENTRQ_HOOKS_ALLOW_USER_HOOKS:false}
  deliveryRetention: ${AGENTRQ_HOOKS_DELIVERY_RETENTION:7d}
  maxPayloadSize: ${AGENTRQ_HOOKS_MAX_PAYLOAD_SIZE:65536}

# Teams let accounts read the workspaces their members share with them. A team may
# create at most maxInvitesPerDay invitations in any 24 hours, revoked ones included;
# 0 turns invitations off. One account may create at most maxInvitesPerUserPerDay
# across all its teams in the same window; 0 is no per-account cap.
# A team workspace holds at most maxSkillsPerWorkspace skills; 0 is the default, 100.
# The most agents one account may run on one machine. A machine's page can set
# a lower cap, never a higher one; 0 is no cap, and then a machine's page may set
# any. agentrqd keeps --max-per-profile too.
machines:
  maxSessions: ${AGENTRQ_MACHINES_MAX_SESSIONS:8}

# What an account may do with its own data. One account may download all its data at
# most maxExportsPerDay times in any 24 hours; 0 is no cap. Each download is emailed
# to the account when SMTP is set up.
account:
  maxExportsPerDay: ${AGENTRQ_ACCOUNT_MAX_EXPORTS_PER_DAY:2}

teams:
  maxInvitesPerDay: ${AGENTRQ_TEAMS_MAX_INVITES_PER_DAY:10}
  maxInvitesPerUserPerDay: ${AGENTRQ_TEAMS_MAX_INVITES_PER_USER_PER_DAY:20}
  emailInvites: ${AGENTRQ_TEAMS_EMAIL_INVITES:true}
  maxSkillsPerWorkspace: ${AGENTRQ_TEAMS_MAX_SKILLS_PER_WORKSPACE:100}

# The token OpenAI gives a plugin submission to prove the MCP server's domain,
# served at /.well-known/openai-apps-challenge. Empty serves 404.
mcp:
  openaiAppsChallenge: ${AGENTRQ_MCP_OPENAI_APPS_CHALLENGE:}

# Errors and panics reported to Sentry, off by default. An event's release is
# the app's version, and its environment the ENV the server runs with.
sentry:
  enabled: ${AGENTRQ_SENTRY_ENABLED:false}
  dsn: "${AGENTRQ_SENTRY_DSN:}"

# The web app's errors reported to Sentry, off by default, through the server
# so the desktop app reports too. Usually a project apart from the server's.
sentryFrontend:
  enabled: ${AGENTRQ_SENTRY_FRONTEND_ENABLED:false}
  dsn: "${AGENTRQ_SENTRY_FRONTEND_DSN:}"

# HTTP metrics for Prometheus at /metrics, off by default. A scrape must carry
# the 32-character token as ?prometheus_token=; any other answers 404.
prometheus:
  enabled: ${AGENTRQ_PROMETHEUS_ENABLED:false}
  token: "${AGENTRQ_PROMETHEUS_TOKEN:}"

# Where recorded actions go. database stores them for the stats pages;
# prometheus counts them on /metrics, by action name only, when prometheus
# is enabled. Either can be off without the other.
telemetry:
  database: ${AGENTRQ_TELEMETRY_DATABASE:true}
  prometheus: ${AGENTRQ_TELEMETRY_PROMETHEUS:true}

# Any S3-compatible store. Objects are addressed path-style. With an endpoint
# and a bucket set, sign-in pictures are kept public in it under avatars/, and
# sign-in providers' icons under login-icons/.
s3:
  endpoint: "${AGENTRQ_S3_ENDPOINT:}"
  accessKey: "${AGENTRQ_S3_ACCESS_KEY:}"
  secretAccessKey: "${AGENTRQ_S3_SECRET_ACCESS_KEY:}"
  region: "${AGENTRQ_S3_REGION:us-east-1}"
  bucket: "${AGENTRQ_S3_BUCKET:}"
  # Base of public links to the bucket, such as a CDN. Unset, it is <endpoint>/<bucket>.
  publicUrl: "${AGENTRQ_S3_PUBLIC_URL:}"


# The node id must be unique across running instances: monoflake ids collide
# otherwise. It is also what identifies this process when a daemon socket is
# paired to an instance, so the same value has to be right for both reasons.
# Unset, it is derived from the MAC address (a hash mod 1024), which can still
# collide: set it per instance (1-1023) to be sure. 1024 or more stops startup.
idgen:
  node: ${MONOFLAKE_NODE:}
