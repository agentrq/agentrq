[package]
name = "agentrq-tauri"
version = "0.13.4"
edition = "2021"
license = "AGPL-3.0-only"
description = "AgentRQ desktop app on Tauri (preview)"
publish = false

[lib]
name = "agentrq_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agentrq-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
agentrq-desktop-core = { path = "../core" }
tauri = { version = "2.12.5", features = ["image-png"] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
http = "1.5.0"
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false }
tokio = { version = "1.54.1", features = ["time"] }
tauri-plugin-updater = "2.14.0"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[features]
# CI's screenshot run (`AGENTRQ_E2E_INIT_SCRIPT`) in a release build.
e2e = []

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
