[package]
name = "agentrq-tauri"
version = "0.13.4"
edition = "2021"
license = "AGPL-3.0-only"
description = "AgentRQ desktop app on Tauri (preview)"
publish = false

[lib]
name = "agentrq_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agentrq-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[features]
# CI's screenshot build, which reads AGENTRQ_E2E_INIT_SCRIPT (see chrome.rs).
e2e = []

[dependencies]
agentrq-desktop-core = { path = "../core" }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
http = "1.5.0"
reqwest = { version = "0.13.5", features = ["cookies", "stream", "gzip", "brotli"] }
tokio = { version = "1.54.1", features = ["time", "sync", "process", "io-util", "macros", "rt"] }
base64 = "0.23.1"
cookie_store = "0.22.1"
url = "2.5.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
futures-util = "0.3.34"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
keyring = "4.2.0"
tauri-plugin-updater = "2.14.0"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-global-shortcut = "2.4.1"
# tauri-plugin-deep-link 2.6.2 fails to compile against rust-ini >= 0.21.2 (missing ParseOption fields)
rust-ini = "=0.21.1"
tauri-plugin-notification = "2.7.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"
gtk = "0.18.2"
cairo-rs = { version = "0.18.5", features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSResponder", "NSEvent", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSProcessInfo", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration", "WKFindConfiguration", "WKFindResult", "WKContentWorld", "WKFrameInfo"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Foundation"] }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }
lzma-rust2 = { version = "0.24.0", default-features = false, features = ["std", "encoder", "xz"] }
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["time", "sync", "macros", "rt", "net", "io-util", "test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
