[package]
name = "agentrq-desktop-core"
version = "0.14.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Pure logic of the AgentRQ desktop app, with no Tauri dependency"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
lzma-rust2 = { version = "0.24.0", default-features = false, features = ["std", "optimization", "xz"] }
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
url = "2.5.8"
zip = { version = "9.1.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
lzma-rust2 = { version = "0.24.0", default-features = false, features = ["std", "encoder", "xz"] }
tempfile = "3"
