name: MCP Registry

# Advertises the remote supervisor MCP server (server.json) on the official
# MCP Registry, https://registry.modelcontextprotocol.io. Pull requests
# validate server.json; a v* tag publishes it with that tag's version.

on:
  pull_request:
    paths:
      - 'server.json'
      - '.github/workflows/mcp-registry.yml'
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned and verified with Sigstore; bump it deliberately.
  MCP_PUBLISHER_VERSION: v1.8.4

jobs:
  registry:
    name: Validate and publish server.json
    runs-on: ubuntu-latest
    permissions:
      # GitHub OIDC login grants the io.github.agentrq/* namespace.
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Check the remote URL
        # Every plugin connects to the same server the registry advertises.
        run: |
          set -euo pipefail
          url="$(jq -r '.remotes[0].url' server.json)"
          test "$url" = "https://mcp.agentrq.com/mcp"
          test "$(jq -r '.mcpServers.agentrq.url' plugins/claude/agentrq/.claude-plugin/plugin.json)" = "$url"
          test "$(jq -r '.mcpServers.agentrq.url' gemini-extension.json)" = "$url"

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          jq --arg v "${GITHUB_REF_NAME#v}" '.version = $v' server.json > server.tmp
          mv server.tmp server.json

      - name: Validate
        run: ./mcp-publisher validate

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
