name: CLA

# Every pull request author must have signed CLA.md. They sign by commenting
# the exact sentence below on any pull request; the signature is recorded in
# signatures/cla.json on the `cla-signatures` branch, which must stay
# unprotected because the action pushes to it.
#
# pull_request_target runs this file as it is on main, never the pull
# request's copy, and the job checks nothing out, so no code from the pull
# request runs with the write token.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor License Agreement
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # step-security's maintained fork: the original
      # contributor-assistant/github-action is archived and still on node20.
      - name: Check signatures
        uses: step-security/contributor-assistant-github-action@b9bd60bf1b766fa48dae03427059187137236239 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/agentrq/agentrq/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: mustafaturan,agentrq-dev,*[bot]
          lock-pullrequest-aftermerge: false
