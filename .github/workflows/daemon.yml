name: Daemon

on:
  push:
    branches:
      - main
    paths:
      - 'daemon/**'
      - '.github/workflows/daemon.yml'
  pull_request:
    paths:
      - 'daemon/**'
      - '.github/workflows/daemon.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.os }}
    # All three, and this matrix is the point of the job rather than caution.
    # The pseudo-terminal layer is the least portable code in the repository:
    # Windows has ConPTY instead of openpty, no SIGWINCH, and different signal
    # semantics. A mocked PTY proves nothing about any of that, so the real
    # thing has to run on every platform we ship to.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Vet
        working-directory: daemon
        run: go vet ./...

      - name: Test
        working-directory: daemon
        # A hung pseudo-terminal test is far worse than a failing one: it burns
        # a runner for the job's whole timeout and reports nothing useful.
        run: go test -timeout 5m ./...

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      # The daemon ships as one static binary for six targets and uses no cgo,
      # so every one of them can be checked from a single runner. Cheap, and it
      # catches a platform-specific import long before a release does.
      - name: Build every target
        working-directory: daemon
        run: |
          set -eu
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "▸ ${target}"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./...
          done

  release-config:
    name: Release config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      # A release config that has drifted is found on release day, when it is
      # least convenient and most tempting to fix by hand. Checked on every
      # change instead.
      - name: Check the goreleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check
          workdir: daemon
        env:
          AGENTRQD_RELEASE_PUBKEY: ''

      # The release job signs a manifest and then verifies it against the key
      # built into the binaries. Rehearsing that here — with a throwaway key and
      # stand-in binaries — means the day a real release is cut, the only new
      # thing is the key.
      - name: Rehearse signing and verifying a release
        working-directory: daemon
        run: |
          set -eu
          keys="$(go run ./cmd/agentrqd-release keygen)"
          export AGENTRQD_RELEASE_PUBKEY="$(echo "$keys" | awk '/^public/{print $NF}')"
          export AGENTRQD_RELEASE_KEY="$(echo "$keys" | awk '/^private/{print $NF}')"

          mkdir -p /tmp/rehearsal
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"; goarch="${target#*/}"
            name="agentrqd_${goos}_${goarch}"
            [ "$goos" = windows ] && name="${name}.exe"
            printf 'stand-in for %s\n' "$target" > "/tmp/rehearsal/${name}"
          done

          go run ./cmd/agentrqd-release manifest \
            --version 0.0.0 \
            --base-url https://releases.example/v0.0.0 \
            /tmp/rehearsal > /tmp/rehearsal/agentrqd.json

          go run ./cmd/agentrqd-release verify --version 0.0.0 /tmp/rehearsal
