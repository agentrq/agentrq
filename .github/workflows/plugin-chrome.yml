name: Chrome Plugin

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/chrome/**'
      - '.github/workflows/plugin-chrome.yml'
  pull_request:
    paths:
      - 'plugins/chrome/**'
      - '.github/workflows/plugin-chrome.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: plugins/chrome

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Use npm 12.2.0
        run: npm install -g npm@12.2.0

      # No install step: the extension has no dependencies.
      - name: Test with coverage thresholds
        run: npm run test:ci

      # What "Load unpacked" or the Chrome Web Store takes: the manifest and
      # what it names, and no tests. The files are uploaded rather than a zip
      # of them, because GitHub zips every artifact on download: an uploaded
      # zip comes back as a zip inside a zip, which the store refuses with "No
      # manifest found". Uploaded this way the download *is* the package.
      # upload-artifact roots the archive at the paths' common parent, which
      # puts manifest.json at the top.
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: agentrq-chrome-extension
          path: |
            plugins/chrome/manifest.json
            plugins/chrome/src
            plugins/chrome/icons
          if-no-files-found: error
