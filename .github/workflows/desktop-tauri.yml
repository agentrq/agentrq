name: Desktop App (Tauri)

on:
  push:
    branches:
      - main
    paths:
      - 'desktop-tauri/**'
      - 'frontend/**'
      - 'desktop/src/renderer/**'
      - 'desktop/src/preload/**'
      - '.github/workflows/desktop-tauri.yml'
  # The renderer is desktop's renderer, built from frontend/src, so a change
  # there can break this build without touching desktop-tauri/.
  pull_request:
    paths:
      - 'desktop-tauri/**'
      - 'frontend/**'
      - 'desktop/src/renderer/**'
      - 'desktop/src/preload/**'
      - '.github/workflows/desktop-tauri.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and build
    # Each OS has its own webview, and the Rust compiles per platform.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Use npm 12.2.0
        run: npm install -g npm@12.2.0

      # WebKitGTK and friends. libxdo is what Tauri's menu accelerators link.
      - name: Install the Linux webview packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install dependencies
        working-directory: desktop-tauri
        run: npm ci

      - name: Check version is in lockstep with the rest of the repo
        run: node desktop/scripts/check-versions.mjs

      - name: Test the JS with coverage
        working-directory: desktop-tauri
        # The thresholds in vitest.config.mjs are the gate.
        run: npm run test:coverage

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop-tauri/core -> target
            desktop-tauri/src-tauri -> target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # tauri::generate_context! reads frontendDist, so it must exist.
      - name: Build the renderer
        working-directory: desktop-tauri
        run: npm run build:renderer

      - name: cargo fmt --check
        working-directory: desktop-tauri
        run: |
          cargo fmt --manifest-path core/Cargo.toml --check
          cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: cargo clippy
        working-directory: desktop-tauri
        run: |
          cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          # The configuration that ships: no `e2e` feature, so its `#[cfg]` code is gone.
          cargo clippy --manifest-path src-tauri/Cargo.toml --release -- -D warnings

      - name: cargo test
        working-directory: desktop-tauri
        run: npm run test:rust

      # 100% of lines over core/ and the pure src-tauri modules. lib.rs and
      # main.rs are the wiring and are left out, as desktop/'s index.js is.
      - name: Rust coverage gate
        working-directory: desktop-tauri
        run: npm run coverage:rust

      - name: Build the app
        working-directory: desktop-tauri
        run: npx tauri build --no-bundle --features e2e

      # Window chrome on each OS, light and dark, for the pull request to read.
      # test/e2e/theme-seed.js seeds localStorage `theme` and asks the shell to
      # paint the window, as the renderer's main.js does once a server is set
      # (WP4); then it hides the page, so the second shot of each pair is the
      # window's own background, which pixel.mjs holds to the theme's colour.
      - name: Install the screenshot tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq xvfb imagemagick

      - name: Screenshots and window background (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop-tauri
        run: |
          mkdir -p shots
          xvfb-run -a -s "-screen 0 1400x900x24" dbus-run-session -- bash -c '
            set -e
            for mode in light dark; do
              if [ "$mode" = dark ]; then want="#09090b"; else want="#fafafa"; fi
              export AGENTRQ_E2E_INIT_SCRIPT="$(sed "s/__THEME__/$mode/" test/e2e/theme-seed.js)"
              WEBKIT_DISABLE_DMABUF_RENDERER=1 src-tauri/target/release/agentrq-tauri &
              APP=$!
              sleep 10
              import -window root PNG24:shots/linux-$mode.png
              sleep 12
              import -window root PNG24:shots/linux-$mode-window.png
              kill $APP
              wait $APP || true
              node test/e2e/pixel.mjs shots/linux-$mode-window.png "$want"
            done'

      - name: Screenshots and window background (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop-tauri
        run: |
          mkdir -p shots
          for mode in light dark; do
            killall -9 agentrq-tauri 2>/dev/null || true
            if [ "$mode" = dark ]; then want="#09090b"; else want="#fafafa"; fi
            export AGENTRQ_E2E_INIT_SCRIPT="$(sed "s/__THEME__/$mode/" test/e2e/theme-seed.js)"
            src-tauri/target/release/agentrq-tauri &
            APP=$!
            sleep 10
            screencapture -x shots/macos-$mode.png
            sleep 12
            screencapture -x shots/macos-$mode-window.png
            kill -9 $APP 2>/dev/null || kill $APP || true
            sleep 3
            node test/e2e/pixel.mjs shots/macos-$mode-window.png "$want" 12
          done

      - name: Screenshots and window background (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop-tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shoot($path) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($path)
          }
          foreach ($mode in 'light', 'dark') {
            $want = if ($mode -eq 'dark') { '#09090b' } else { '#fafafa' }
            $env:AGENTRQ_E2E_INIT_SCRIPT = (Get-Content -Raw test\e2e\theme-seed.js).Replace('__THEME__', $mode)
            $app = Start-Process src-tauri\target\release\agentrq-tauri.exe -PassThru
            Start-Sleep 10
            Shoot "shots\windows-$mode.png"
            Start-Sleep 12
            Shoot "shots\windows-$mode-window.png"
            Stop-Process -Id $app.Id -Force
            Start-Sleep 3
            node test/e2e/pixel.mjs "shots\windows-$mode-window.png" $want 12
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-shots-${{ runner.os }}
          path: desktop-tauri/shots
          if-no-files-found: ignore

  # The headless parity checks (desktop-tauri/scripts/verify-*.mjs): the real
  # debug app, driven by tauri-driver, against a scratch backend built from
  # backend/. macOS has no WKWebView driver, so it stays a manual row.
  verify:
    name: Verify scripts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Use npm 12.2.0
        run: npm install -g npm@12.2.0

      # WebKitGTK to build against; WebKitWebDriver for tauri-driver; Xvfb and a
      # session bus to run the app on; xclip to read the clipboard it writes.
      - name: Install the Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev webkit2gtk-driver xvfb xclip dbus-x11

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> target

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # Edge's driver must match the WebView2 runtime on the machine.
      - name: Install msedgedriver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --locked
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          "VERIFY_NATIVE_DRIVER=$PWD\msedgedriver.exe" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install dependencies
        working-directory: desktop-tauri
        run: npm ci

      - name: Build the debug app
        working-directory: desktop-tauri
        run: npm run build:debug

      - name: Verify scripts (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop-tauri
        run: xvfb-run -a -s "-screen 0 1400x900x24" dbus-run-session -- npm run verify

      - name: Verify scripts (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop-tauri
        run: npm run verify
