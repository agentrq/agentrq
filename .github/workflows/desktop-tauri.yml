name: Desktop App (Tauri)

on:
  push:
    branches:
      - main
    paths:
      - 'desktop-tauri/**'
      - 'frontend/**'
      - 'desktop/src/renderer/**'
      - 'desktop/src/preload/**'
      # The extension host runs these unchanged, and its tests run the examples.
      - 'desktop/src/main/extensions/**'
      - 'desktop/src/main/side-panel/bridge.js'
      - 'desktop/src/main/side-panel/guest.js'
      - 'desktop/src/main/links.js'
      - 'desktop/src/main/auth.js'
      - 'desktop/test/examples/**'
      - 'examples/extensions/**'
      - 'backend/**'
      - '.github/workflows/desktop-tauri.yml'
  # The renderer is desktop's renderer, built from frontend/src, so a change
  # there can break this build without touching desktop-tauri/.
  pull_request:
    paths:
      - 'desktop-tauri/**'
      - 'frontend/**'
      - 'desktop/src/renderer/**'
      - 'desktop/src/preload/**'
      # The extension host runs these unchanged, and its tests run the examples.
      - 'desktop/src/main/extensions/**'
      - 'desktop/src/main/side-panel/bridge.js'
      - 'desktop/src/main/side-panel/guest.js'
      - 'desktop/src/main/links.js'
      - 'desktop/src/main/auth.js'
      - 'desktop/test/examples/**'
      - 'examples/extensions/**'
      - 'backend/**'
      - '.github/workflows/desktop-tauri.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and build
    # Each OS has its own webview, and the Rust compiles per platform.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Use npm 12.2.0
        run: npm install -g npm@12.2.0

      # WebKitGTK and friends. libxdo is what Tauri's menu accelerators link.
      - name: Install the Linux webview packages
        if: runner.os == 'Linux'
        run: |
          # A trickling mirror once ate 27 minutes of a job. apt drops a connection
          # silent for 30 s and retries that file; the cap only ends a try that is
          # still stuck, and the next resumes from the packages already fetched.
          for try in 1 2 3; do
            timeout -k 30 300 sudo apt-get update -q -o Acquire::http::Timeout=30 -o Acquire::Retries=5 &&
              timeout -k 30 900 sudo apt-get install -y -q -o Dpkg::Use-Pty=0 -o DPkg::Lock::Timeout=60 -o Acquire::http::Timeout=30 -o Acquire::Retries=5 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev && break
            rc=$?
            [ "$try" = 3 ] && exit 1
            echo "::warning::apt try $try failed or stalled (exit $rc); retrying"
            # -k kills sudo, not its child: end what is left before recovering.
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            timeout -k 10 120 sudo dpkg --configure -a || true
            sleep 10
          done

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install dependencies
        working-directory: desktop-tauri
        run: npm ci

      - name: Check version is in lockstep with the rest of the repo
        run: node desktop/scripts/check-versions.mjs

      - name: Test the JS with coverage
        working-directory: desktop-tauri
        # The thresholds in vitest.config.mjs are the gate.
        run: npm run test:coverage

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop-tauri/core -> target
            desktop-tauri/src-tauri -> target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # tauri-build checks resources exist: the extension host's bundle.
      - name: Bundle the extension host
        working-directory: desktop-tauri
        run: npm run build:ext-host

      # tauri::generate_context! reads frontendDist, so it must exist.
      - name: Build the renderer
        working-directory: desktop-tauri
        run: npm run build:renderer

      - name: cargo fmt --check
        working-directory: desktop-tauri
        run: |
          cargo fmt --manifest-path core/Cargo.toml --check
          cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: cargo clippy
        working-directory: desktop-tauri
        run: |
          cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          # The configuration that ships: no `e2e` feature, so its `#[cfg]` code is gone.
          cargo clippy --manifest-path src-tauri/Cargo.toml --release -- -D warnings

      - name: cargo test
        working-directory: desktop-tauri
        run: npm run test:rust

      # 100% of lines over core/ and the pure src-tauri modules. lib.rs and
      # main.rs are the wiring and are left out, as desktop/'s index.js is.
      - name: Rust coverage gate
        working-directory: desktop-tauri
        run: npm run coverage:rust

      - name: Build the app
        working-directory: desktop-tauri
        run: npx tauri build --no-bundle --features e2e

      # Window chrome on each OS, light and dark, for the pull request to read.
      # test/e2e/theme-seed.js seeds localStorage `theme` and asks the shell to
      # paint the window, as the renderer's main.js does once a server is set
      # (WP4); then it hides the page, so the second shot of each pair is the
      # window's own background, which pixel.mjs holds to the theme's colour.
      - name: Install the screenshot tools
        if: runner.os == 'Linux'
        run: |
          # A trickling mirror once ate 27 minutes of a job. apt drops a connection
          # silent for 30 s and retries that file; the cap only ends a try that is
          # still stuck, and the next resumes from the packages already fetched.
          for try in 1 2 3; do
            timeout -k 30 300 sudo apt-get update -q -o Acquire::http::Timeout=30 -o Acquire::Retries=5 &&
              timeout -k 30 900 sudo apt-get install -y -q -o Dpkg::Use-Pty=0 -o DPkg::Lock::Timeout=60 -o Acquire::http::Timeout=30 -o Acquire::Retries=5 xvfb imagemagick && break
            rc=$?
            [ "$try" = 3 ] && exit 1
            echo "::warning::apt try $try failed or stalled (exit $rc); retrying"
            # -k kills sudo, not its child: end what is left before recovering.
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            timeout -k 10 120 sudo dpkg --configure -a || true
            sleep 10
          done

      - name: Screenshots and window background (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop-tauri
        run: |
          mkdir -p shots
          xvfb-run -a -s "-screen 0 1400x900x24" dbus-run-session -- bash -c '
            set -e
            for mode in light dark; do
              if [ "$mode" = dark ]; then want="#09090b"; else want="#fafafa"; fi
              export AGENTRQ_E2E_INIT_SCRIPT="$(sed "s/__THEME__/$mode/" test/e2e/theme-seed.js)"
              WEBKIT_DISABLE_DMABUF_RENDERER=1 src-tauri/target/release/agentrq-tauri &
              APP=$!
              sleep 10
              import -window root PNG24:shots/linux-$mode.png
              sleep 12
              import -window root PNG24:shots/linux-$mode-window.png
              kill $APP
              wait $APP || true
              node test/e2e/pixel.mjs shots/linux-$mode-window.png "$want"
            done'

      # WP9's acceptance: the five examples through window.agentrq in the real
      # app, its steps reported to test/e2e/extensions-server.mjs, which also
      # streams the guardrail a tool call to refuse and answers the
      # supervisor's OAuth with a real redirect to agentrq://. An xdg-open
      # first on PATH records any call: the OAuth window must make none.
      - name: Extensions in the app (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop-tauri
        run: |
          node test/e2e/extensions-server.mjs 39117 > extension-steps.txt &
          SERVER=$!
          export AGENTRQ_SERVER_URL=http://127.0.0.1:39117
          export AGENTRQ_E2E_INIT_SCRIPT="$(sed "s|__EXAMPLES__|$(cd ../examples/extensions && pwd)|" test/e2e/extensions.js)"
          export XDG_DATA_HOME="$RUNNER_TEMP/agentrq-data"
          mkdir -p "$RUNNER_TEMP/opener"
          printf '#!/bin/sh\necho "$@" >> "%s"\n' "$RUNNER_TEMP/opened.txt" > "$RUNNER_TEMP/opener/xdg-open"
          chmod +x "$RUNNER_TEMP/opener/xdg-open"
          export PATH="$RUNNER_TEMP/opener:$PATH"
          xvfb-run -a -s "-screen 0 1400x900x24" dbus-run-session -- bash -c '
            WEBKIT_DISABLE_DMABUF_RENDERER=1 src-tauri/target/release/agentrq-tauri &
            APP=$!
            for i in $(seq 1 180); do kill -0 '$SERVER' 2>/dev/null || break; sleep 1; done
            kill $APP
            wait $APP || true'
          cat extension-steps.txt
          if kill -0 $SERVER 2>/dev/null; then kill $SERVER; echo 'The steps never finished.'; exit 1; fi
          wait $SERVER
          if [ -s "$RUNNER_TEMP/opened.txt" ]; then echo 'xdg-open was called:'; cat "$RUNNER_TEMP/opened.txt"; exit 1; fi

      # desktop/test/examples and the five examples through the bundled host,
      # on the Node.js the acceptance above downloaded.
      - name: The examples on the app's own Node.js (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop-tauri
        run: npm run test:sidecar -- "$RUNNER_TEMP/agentrq-data/com.agentrq.desktop.tauri/bin/node"

      - name: Screenshots and window background (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop-tauri
        run: |
          mkdir -p shots
          for mode in light dark; do
            killall -9 agentrq-tauri 2>/dev/null || true
            if [ "$mode" = dark ]; then want="#09090b"; else want="#fafafa"; fi
            export AGENTRQ_E2E_INIT_SCRIPT="$(sed "s/__THEME__/$mode/" test/e2e/theme-seed.js)"
            src-tauri/target/release/agentrq-tauri &
            APP=$!
            sleep 10
            screencapture -x shots/macos-$mode.png
            sleep 12
            screencapture -x shots/macos-$mode-window.png
            kill -9 $APP 2>/dev/null || kill $APP || true
            sleep 3
            node test/e2e/pixel.mjs shots/macos-$mode-window.png "$want" 12
          done

      - name: Screenshots and window background (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop-tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shoot($path) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($path)
          }
          foreach ($mode in 'light', 'dark') {
            $want = if ($mode -eq 'dark') { '#09090b' } else { '#fafafa' }
            $env:AGENTRQ_E2E_INIT_SCRIPT = (Get-Content -Raw test\e2e\theme-seed.js).Replace('__THEME__', $mode)
            $app = Start-Process src-tauri\target\release\agentrq-tauri.exe -PassThru
            Start-Sleep 10
            Shoot "shots\windows-$mode.png"
            Start-Sleep 12
            Shoot "shots\windows-$mode-window.png"
            Stop-Process -Id $app.Id -Force
            Start-Sleep 3
            node test/e2e/pixel.mjs "shots\windows-$mode-window.png" $want 12
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # The app's own window never shows WebView2's notification prompt (the
      # Workspace settings' Enable Push): main-notifications.js asks, and
      # extensions-server.mjs takes the answer, which must be "denied". A
      # prompt leaves it unanswered.
      - name: The window refuses notifications (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop-tauri
        shell: pwsh
        timeout-minutes: 5
        run: |
          $server = Start-Process node -ArgumentList 'test/e2e/extensions-server.mjs', '39118' -RedirectStandardOutput notify-steps.txt -PassThru -NoNewWindow
          # Read now, or ExitCode stays empty once it has exited.
          $null = $server.Handle
          $env:AGENTRQ_SERVER_URL = 'http://127.0.0.1:39118'
          $env:AGENTRQ_E2E_INIT_SCRIPT = Get-Content -Raw test\e2e\main-notifications.js
          $app = Start-Process src-tauri\target\release\agentrq-tauri.exe -PassThru
          $answered = $server.WaitForExit(90000)
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-Content notify-steps.txt
          if (-not $answered) {
            Stop-Process -Id $server.Id -Force
            Write-Output 'The window was never answered: WebView2 asked the person.'
            exit 1
          }
          if ($server.ExitCode -ne 0) { exit 1 }

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-shots-${{ runner.os }}
          path: desktop-tauri/shots
          if-no-files-found: ignore

  # The headless parity checks (desktop-tauri/scripts/verify-*.mjs): the real
  # debug app, driven by tauri-driver, against a scratch backend built from
  # backend/. Linux only: macOS has no WKWebView driver, so it stays a manual
  # row, and on Windows msedgedriver cannot start the app ("DevToolsActivePort
  # file doesn't exist"), so that row is manual too.
  verify:
    name: Verify scripts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Use npm 12.2.0
        run: npm install -g npm@12.2.0

      # WebKitGTK to build against; WebKitWebDriver for tauri-driver; Xvfb and a
      # session bus to run the app on; xclip to read the clipboard it writes;
      # xdotool to click in a panel site, which WebKitGTK needs before it asks to notify.
      - name: Install the Linux packages
        run: |
          # A trickling mirror once ate 27 minutes of a job. apt drops a connection
          # silent for 30 s and retries that file; the cap only ends a try that is
          # still stuck, and the next resumes from the packages already fetched.
          for try in 1 2 3; do
            timeout -k 30 300 sudo apt-get update -q -o Acquire::http::Timeout=30 -o Acquire::Retries=5 &&
              timeout -k 30 900 sudo apt-get install -y -q -o Dpkg::Use-Pty=0 -o DPkg::Lock::Timeout=60 -o Acquire::http::Timeout=30 -o Acquire::Retries=5 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev webkit2gtk-driver xvfb xclip xdotool dbus-x11 python3-gi && break
            rc=$?
            [ "$try" = 3 ] && exit 1
            echo "::warning::apt try $try failed or stalled (exit $rc); retrying"
            # -k kills sudo, not its child: end what is left before recovering.
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            timeout -k 10 120 sudo dpkg --configure -a || true
            sleep 10
          done

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> target

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked --version 2.1.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install dependencies
        working-directory: desktop-tauri
        run: npm ci

      - name: Build the debug app
        working-directory: desktop-tauri
        run: npm run build:debug

      - name: Verify scripts
        working-directory: desktop-tauri
        run: xvfb-run -a -s "-screen 0 1400x900x24" dbus-run-session -- npm run verify
