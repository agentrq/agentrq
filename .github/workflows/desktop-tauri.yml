name: Desktop App (Tauri)

on:
  push:
    branches:
      - main
    paths:
      - 'desktop-tauri/**'
      - 'frontend/**'
      - 'desktop/src/renderer/**'
      - 'desktop/src/preload/**'
      - '.github/workflows/desktop-tauri.yml'
  # The renderer is desktop's renderer, built from frontend/src, so a change
  # there can break this build without touching desktop-tauri/.
  pull_request:
    paths:
      - 'desktop-tauri/**'
      - 'frontend/**'
      - 'desktop/src/renderer/**'
      - 'desktop/src/preload/**'
      - '.github/workflows/desktop-tauri.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and build
    # Each OS has its own webview, and the Rust compiles per platform.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Use npm 12.2.0
        run: npm install -g npm@12.2.0

      # WebKitGTK and friends. libxdo is what Tauri's menu accelerators link.
      - name: Install the Linux webview packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install dependencies
        working-directory: desktop-tauri
        run: npm ci

      - name: Check version is in lockstep with the rest of the repo
        run: node desktop/scripts/check-versions.mjs

      - name: Test the JS with coverage
        working-directory: desktop-tauri
        # The thresholds in vitest.config.mjs are the gate.
        run: npm run test:coverage

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop-tauri/core -> target
            desktop-tauri/src-tauri -> target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # tauri::generate_context! reads frontendDist, so it must exist.
      - name: Build the renderer
        working-directory: desktop-tauri
        run: npm run build:renderer

      - name: cargo fmt --check
        working-directory: desktop-tauri
        run: |
          cargo fmt --manifest-path core/Cargo.toml --check
          cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: cargo clippy
        working-directory: desktop-tauri
        run: |
          cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        working-directory: desktop-tauri
        run: npm run test:rust

      # 100% of lines over core/ and the pure src-tauri modules. lib.rs and
      # main.rs are the wiring and are left out, as desktop/'s index.js is.
      - name: Rust coverage gate
        working-directory: desktop-tauri
        run: npm run coverage:rust

      - name: Build the app
        working-directory: desktop-tauri
        run: npx tauri build --no-bundle

      # Window chrome on each OS, light and dark, for the pull request to read.
      # Dark is the OS's own appearance, which the renderer follows under its
      # "system" theme. A look, never a gate.
      - name: Install the screenshot tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq xvfb imagemagick

      - name: Screenshots (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: desktop-tauri
        run: |
          mkdir -p shots
          xvfb-run -a -s "-screen 0 1400x900x24" dbus-run-session -- bash -c '
            WEBKIT_DISABLE_DMABUF_RENDERER=1 src-tauri/target/release/agentrq-tauri &
            APP=$!
            sleep 25
            import -window root shots/linux-light.png
            kill $APP'

      - name: Screenshots (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        working-directory: desktop-tauri
        run: |
          mkdir -p shots
          for mode in light dark; do
            if [ "$mode" = dark ]; then defaults write -g AppleInterfaceStyle Dark; fi
            src-tauri/target/release/agentrq-tauri &
            APP=$!
            sleep 25
            screencapture -x shots/macos-$mode.png
            kill $APP
            sleep 3
          done
          defaults delete -g AppleInterfaceStyle || true

      - name: Screenshots (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: desktop-tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          foreach ($mode in 'light', 'dark') {
            Set-ItemProperty $key -Name AppsUseLightTheme -Value ($(if ($mode -eq 'light') { 1 } else { 0 }))
            $app = Start-Process src-tauri\target\release\agentrq-tauri.exe -PassThru
            Start-Sleep 25
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\windows-$mode.png")
            Stop-Process -Id $app.Id -Force
            Start-Sleep 3
          }
          Set-ItemProperty $key -Name AppsUseLightTheme -Value 1

      - name: Upload the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: chrome-shots-${{ runner.os }}
          path: desktop-tauri/shots
          if-no-files-found: ignore
