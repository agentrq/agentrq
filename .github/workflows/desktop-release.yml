name: Desktop Release

# The published GitHub Release is also the auto-update feed: electron-updater
# reads the latest*.yml manifests published alongside the installers. Anything
# that breaks this workflow stops existing installs updating, not just new
# downloads.
on:
  push:
    tags:
      - 'v*'
  # A packaging break is invisible to the ordinary test workflow, which never
  # runs electron-builder. This job builds without publishing so review catches
  # it instead of a release attempt.
  pull_request:
    paths:
      - 'desktop/**'
      - 'desktop-tauri/**'
      - 'frontend/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Cheap, and it fails the whole release before any 20-minute build starts.
  versions:
    name: Version sync
    runs-on: ubuntu-latest
    permissions:
      # write, not read, because this job now also creates the draft release
      # the build matrix publishes into. See the step at the end.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag-is-on-main check below walks history, which a shallow
          # checkout does not have.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Use npm 12.2.0
        run: npm install -g npm@12.2.0

      - name: Check desktop, frontend and backend agree
        working-directory: desktop
        # Also asserts the tag matches, so v0.5.0 cannot be cut from a tree
        # still stamped 0.4.8 — that would publish artifacts named for one
        # version inside a release named for another, and offer users an
        # "update" to the build they already have.
        run: node scripts/check-versions.mjs

      # A tag is just a pointer, and it can be pushed from any commit — a
      # branch that is still in review, or one that was never opened as a pull
      # request at all. Shipping that means the release, the auto-update feed
      # and main all disagree about what the app is. The check is here rather
      # than in the build matrix so it fails in seconds, before a draft exists
      # or a 20-minute build starts.
      - name: Check the tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF#refs/tags/} points at a commit that is not on main. Merge it first, then tag the merge."
            exit 1
          fi
          echo "tagged commit is on main"

      # Create the draft up front so nothing downstream ever has to.
      #
      # electron-builder creates the release when it finds none, and in v0.4.10
      # that raced three ways: the matrix runs in parallel, and a single job
      # runs several publishers at once (macOS logged "creating GitHub release
      # reason=release doesn't exist" twice in the same second). GitHub permits
      # more than one *draft* sharing a tag, so the duplicates were accepted
      # silently and the uploads scattered across them. The publish job then
      # promoted whichever one `gh` resolved, and v0.4.10 shipped with the
      # macOS and Windows artifacts but none of the four Linux ones — every job
      # green, the release quietly incomplete.
      #
      # With the draft already present, every publisher takes the "found it"
      # path and they all upload to the same release.
      - name: Create the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it alone."
          else
            gh release create "$TAG" --draft --title "$TAG" \
              --generate-notes --repo "$GITHUB_REPOSITORY"
            echo "Created draft release $TAG"
          fi

  build:
    name: Build ${{ matrix.os }}
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Use npm 12.2.0
        run: npm install -g npm@12.2.0

      # The renderer is built from ../frontend/src, and those modules resolve
      # their own dependencies out of frontend/node_modules.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Test
        working-directory: desktop
        run: npm run test:coverage

      # Signing is credential-gated rather than assumed. Without a certificate
      # the build still succeeds and ships unsigned: Windows and Linux install
      # and update normally, while macOS auto-update stays unavailable because
      # Squirrel.Mac refuses to install onto an unsigned app. Adding the
      # secrets is all that is needed to turn it on.
      - name: Detect signing credentials
        id: signing
        shell: bash
        run: |
          if [ -n "${{ secrets.MAC_CERTIFICATE }}${{ secrets.WIN_CERTIFICATE }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing certificate configured; building unsigned. macOS auto-update will not work for this release."
          fi

      - name: Build and publish
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS Developer ID, and the Apple account used to notarize.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows certificate, reusing electron-builder's CSC_* convention.
          WIN_CSC_LINK: ${{ secrets.WIN_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
          # Without this, electron-builder hunts the runner's keychain and
          # fails confusingly instead of building an unsigned app.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.available }}
        run: |
          npm run build

          # An empty CSC_LINK is not the same as an unset one. GitHub Actions
          # defines the variable as "" when the secret does not exist, and
          # electron-builder then resolves that empty string as a certificate
          # path -- landing on the working directory and dying with
          # "<projectDir> not a file" before it packages anything.
          #
          # Pull request builds cannot catch this: electron-builder detects a
          # PR and skips code signing entirely ("Current build is a part of
          # pull request, code signing will be skipped"), so the empty value is
          # never resolved. It only surfaces on a tag build, which is the worst
          # possible moment to find out.
          if [ "${{ steps.signing.outputs.available }}" != "true" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi

          # A tag is the only thing that publishes. Asking "is this a pull
          # request?" instead let a manual run from any branch reach the
          # `always` path: electron-builder finds no release for the version in
          # package.json, creates one itself, and uploads installers built from
          # unmerged code under a tag that does not exist yet. Worse, the draft
          # it leaves behind is then adopted by the real tag build — which
          # deliberately reuses an existing release for its tag — mixing
          # artifacts from two different trees into one release.
          #
          # Dispatching the workflow against a tag still publishes, which is
          # the escape hatch for a release that failed halfway.
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            npx electron-builder --publish always
          else
            # Prove it packages; publish nothing.
            npx electron-builder --publish never
          fi

      # Kept for a tag build too: if publishing ever fails, the installers are
      # still recoverable from the run rather than needing a rebuild.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentrq-desktop-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/latest*.yml

  # Tauri ships beside Electron under AgentRQ-Tauri-* names and its own feed,
  # latest-tauri.json, so nothing here may touch an Electron asset or the
  # publish job's needs.
  build-tauri:
    name: Build Tauri ${{ matrix.platform }}-${{ matrix.arch }}
    needs: versions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux, arch: x64, bundles: 'deb,appimage' }
          # The .app is built only as the updater archive: without the app
          # target Tauri deletes it after making the dmg.
          - { os: macos-latest, platform: macos, arch: arm64, bundles: 'app,dmg' }
          # Cross-compiled; Intel Macs get their own key and never the arm64 app.
          - { os: macos-latest, platform: macos, arch: x64, bundles: 'app,dmg', target: x86_64-apple-darwin }
          - { os: windows-latest, platform: windows, arch: x64, bundles: nsis }
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Use npm 12.2.0
        run: npm install -g npm@12.2.0

      - name: Install the Linux webview packages
        if: runner.os == 'Linux'
        run: |
          # A trickling mirror once ate 27 minutes of a job. apt drops a connection
          # silent for 30 s and retries that file; the cap only ends a try that is
          # still stuck, and the next resumes from the packages already fetched.
          for try in 1 2 3; do
            timeout -k 30 300 sudo apt-get update -q -o Acquire::http::Timeout=30 -o Acquire::Retries=5 &&
              timeout -k 30 900 sudo apt-get install -y -q -o Dpkg::Use-Pty=0 -o DPkg::Lock::Timeout=60 -o Acquire::http::Timeout=30 -o Acquire::Retries=5 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev && break
            rc=$?
            [ "$try" = 3 ] && exit 1
            echo "::warning::apt try $try failed or stalled (exit $rc); retrying"
            # -k kills sudo, not its child: end what is left before recovering.
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            timeout -k 10 120 sudo dpkg --configure -a || true
            sleep 10
          done

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install desktop-tauri dependencies
        working-directory: desktop-tauri
        run: npm ci

      - name: Build the renderer
        working-directory: desktop-tauri
        run: npm run build:renderer

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch }}
          workspaces: |
            desktop-tauri/core -> target
            desktop-tauri/src-tauri -> target

      # Secrets reach a tag build only: any branch's build script or dependency
      # could read them. They go in under names Tauri does not read, and are
      # exported only when non-empty, because Actions defines a missing secret
      # as "" and Tauri tries to import an empty APPLE_CERTIFICATE and fails.
      - name: Build Tauri bundles
        id: build
        working-directory: desktop-tauri
        shell: bash
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          UPDATER_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          UPDATER_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          MAC_CERT: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MAC_CERTIFICATE || '' }}
          MAC_CERT_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          NOTARY_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID || '' }}
          NOTARY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          NOTARY_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_TEAM_ID || '' }}
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
        run: |
          args=(--bundles "$BUNDLES")
          [ -z "$TARGET" ] || args+=(--target "$TARGET")

          # Anything but a tag signs with a throwaway key, so a pull request
          # proves the same signing path a release takes.
          if [ -z "$UPDATER_KEY" ] && [ "$IS_TAG" != "true" ]; then
            npx tauri signer generate --ci -p '' -w "$RUNNER_TEMP/throwaway.key"
            UPDATER_KEY="$(cat "$RUNNER_TEMP/throwaway.key")"
            UPDATER_KEY_PASSWORD=''
          fi
          if [ -n "$UPDATER_KEY" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$UPDATER_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$UPDATER_KEY_PASSWORD"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY configured; building without updater artifacts."
            args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi

          if [ -n "$MAC_CERT" ]; then
            export APPLE_CERTIFICATE="$MAC_CERT"
            export APPLE_CERTIFICATE_PASSWORD="$MAC_CERT_PASSWORD"
            # Without all three Tauri skips notarization with only a warning.
            if [ -n "$NOTARY_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ]; then
              export APPLE_ID="$NOTARY_ID" APPLE_PASSWORD="$NOTARY_PASSWORD" APPLE_TEAM_ID="$NOTARY_TEAM_ID"
            elif [ "$RUNNER_OS" = "macOS" ]; then
              echo "::warning::No Apple notarization credentials; the macOS app will not be notarized."
            fi
          fi

          npx tauri build "${args[@]}"

      - name: Collect Tauri release artifacts
        shell: bash
        env:
          BUNDLE_DIR: desktop-tauri/src-tauri/target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/bundle
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          SIGNED: ${{ steps.build.outputs.signed }}
        run: |
          args=(--platform "$PLATFORM" --arch "$ARCH" --bundle-dir "$BUNDLE_DIR" --out tauri-release)
          [ "$SIGNED" != "true" ] || args+=(--signed)
          node desktop-tauri/scripts/collect-artifacts.mjs "${args[@]}"

      # Proves on every build that this leg's signatures make a feed. The real
      # one is made from the release, after every leg, by updater-manifest.
      - name: Check the updater feed for this leg
        if: steps.build.outputs.signed == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/feed"
          cp tauri-release/*.sig "$RUNNER_TEMP/feed/"
          node desktop-tauri/scripts/collect-artifacts.mjs --manifest --dir "$RUNNER_TEMP/feed" --tag "v$(node -p "require('./desktop-tauri/package.json').version")"
          cat "$RUNNER_TEMP/feed/latest-tauri.json"

      # `versions` created the draft before this job started.
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF#refs/tags/}" tauri-release/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentrq-desktop-tauri-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: tauri-release/*

  # electron-builder attaches to a draft; publishing only once every platform
  # has finished means users never see a release missing the installer for
  # their machine, and electron-updater never reads a half-populated feed.
  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          echo "Published $TAG" >> "$GITHUB_STEP_SUMMARY"

  # The feed is made once, from what every leg uploaded, so no partial
  # latest-tauri.json is ever live. A failed leg leaves its platform out
  # rather than holding back the others.
  updater-manifest:
    name: Generate Tauri updater manifest
    needs: build-tauri
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Generate and upload latest-tauri.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_UPDATER_KEY" != "true" ]; then
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY configured; no updater artifacts, so no latest-tauri.json."
            exit 0
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          gh release download "$TAG" -p 'AgentRQ-Tauri-*.sig' --dir sigs --repo "$GITHUB_REPOSITORY"
          node desktop-tauri/scripts/collect-artifacts.mjs --manifest --dir sigs --tag "$TAG" --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" sigs/latest-tauri.json --clobber --repo "$GITHUB_REPOSITORY"
