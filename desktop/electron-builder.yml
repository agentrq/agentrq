# Packaging for the AgentRQ desktop app.
#
# The published GitHub Release is also the auto-update feed: electron-updater
# reads the `latest*.yml` manifests electron-builder writes alongside the
# installers, so those files matter as much as the artifacts themselves.

appId: com.agentrq.desktop
productName: AgentRQ
# The legal owner of the app, which is not the product name: this string is
# what macOS puts in NSHumanReadableCopyright and shows in the About panel
# the app menu opens, and what Windows records as the executable's legal
# copyright. appId and productName stay AgentRQ -- changing either would
# rename the app or orphan existing installs from their updates.
copyright: Copyright © 2026 Contextual, Inc.

directories:
  output: release
  buildResources: resources

# The renderer, main and preload bundles, plus package.json for the version.
# Production dependencies (electron-updater) are included automatically.
files:
  - dist/**/*
  - package.json

# Every platform's icon, shared with the web build rather than duplicated.
# electron-builder converts this one PNG into the .icns macOS wants, the .ico
# Windows wants, and the hicolor icon set a Linux package installs.
#
# It is not, however, enough on Linux on its own: nothing in an AppImage or a
# .deb tells a *running window* what icon to show, so the windows are handed
# this same file at runtime too. See desktop/src/main/app-icon.js.
icon: ../frontend/public/large-icon.png

# Deep links. `app.setAsDefaultProtocolClient()` at runtime is enough for
# Windows and Linux, but macOS only routes a scheme to an app that declares it
# in its bundle — without this, agentrq:// links silently do nothing on a
# packaged macOS build, which no amount of runtime code can fix.
protocols:
  - name: AgentRQ
    schemes: [agentrq]

publish:
  provider: github
  owner: agentrq
  repo: agentrq
  # Artifacts are attached to a draft release; the workflow publishes it once
  # every platform has finished, so users never see a release missing the
  # installer for their machine.
  releaseType: draft

mac:
  category: public.app-category.developer-tools
  target:
    # dmg is what people download; zip is what Squirrel.Mac reads to update.
    # Both architectures, because an Intel user offered an arm64 update would
    # be stuck.
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Hardened runtime and the entitlements below are prerequisites for
  # notarization; harmless on an unsigned build.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    # macOS refuses to show the microphone prompt without a reason string, and
    # the speech-to-text pipeline would fail silently.
    NSMicrophoneUsageDescription: AgentRQ uses the microphone for voice dictation.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  # arm64 alongside x64: ARM Windows laptops are no longer unusual, and running
  # the x64 build under emulation there is measurably worse.
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Updates are applied by the app itself, so the installer should not demand
  # the user close and reopen it.
  deleteAppDataOnUninstall: false

linux:
  category: Development
  maintainer: AgentRQ <hi@agentrq.com>
  # A directory, not the PNG above, and that is the whole point. A Linux
  # package installs one icon file per size into the freedesktop hicolor
  # theme, but electron-builder does not resize anything to build that set:
  # for the `set` format the output extension *is* `.png`, so a single PNG
  # source is passed straight through as a set of exactly one, and the .deb
  # ships a 1024x1024 icon and nothing else. Only a directory of `NxN.png`
  # files produces a real set.
  #
  # The contents are rendered from frontend/public/favicon.svg — the same mark
  # — by `npm run icons`, and committed, so packaging never depends on that
  # script having been run. It matters that it cannot be skipped: a missing
  # icon directory does not fail the build, it quietly falls back to the
  # default Electron icon. desktop/test/app-icon.test.js checks the committed
  # set is complete and still matches the mark.
  icon: resources/icons
  # What links a running window to its installed launcher entry, and so what
  # decides whether the dock shows the app's icon or a generic one.
  #
  # A desktop environment matches the two by app id. Electron takes its id from
  # `desktopName` in package.json, defaulting to `<app name>.desktop`;
  # electron-builder writes `StartupWMClass` from that same value, but only
  # when this flag is set, and otherwise from the *product* name. Those two
  # names are not the same here — Linux names the executable, the package and
  # the icon `agentrq-desktop` (package.json's `name`) while the product is
  # AgentRQ — so by default the entry claims `StartupWMClass=AgentRQ` for a
  # window that announces itself as `agentrq-desktop`. The two never meet, and
  # GNOME and KDE show the running window with a generic icon however good the
  # installed icon set is.
  #
  # `agentrq-desktop.desktop` is deliberately the name everything else on Linux
  # already uses, and the one Electron already derives by default: setting it
  # renames no installed file and changes no runtime behaviour. It only makes
  # StartupWMClass agree with what was always being announced.
  syncDesktopName: true
  # arm64 alongside x64: ARM single-board machines and ARM cloud instances are
  # both ordinary places to run this. Nothing here has a native dependency, so
  # both architectures cross-build from one runner.
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
